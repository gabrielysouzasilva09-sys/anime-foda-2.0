<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniReview - Plataforma de Animes</title>
    <style>
        /* ===== Reset & Variáveis ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary:    #0d0d0f;
            --bg-secondary:  #16161a;
            --bg-card:       #1f1f26;
            --bg-card-hover: #252530;
            --accent:        #7c3aed;
            --accent-hover:  #8b5cf6;
            --accent-glow:   rgba(124, 58, 237, 0.35);
            --text-primary:  #f4f4f5;
            --text-secondary:#a1a1aa;
            --text-muted:    #71717a;
            --border:        #27272a;
            --star:          #3f3f46;
            --star-filled:   #fbbf24;
            --success:       #22c55e;
            --warning:       #eab308;
            --danger:        #ef4444;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* ===== Toast de Sucesso ===== */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--success);
            color: #fff;
            padding: 0.85rem 1.4rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 8px 30px rgba(34, 197, 94, 0.4);
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            transform: translateY(120%);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .toast.show { transform: translateY(0); }

        /* ===== Header ===== */
        header {
            background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
            border-bottom: 1px solid var(--border);
            padding: 1.25rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 1.75rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent) 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .search-container {
            flex: 1;
            max-width: 480px;
            min-width: 250px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 3rem;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: all 0.3s;
        }
        .search-input::placeholder { color: var(--text-muted); }
        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        .search-btn {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--accent);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: background 0.2s;
        }
        .search-btn:hover { background: var(--accent-hover); }

        /* ===== Main ===== */
        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        section { margin-bottom: 3rem; }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        h2 {
            font-size: 1.4rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        h2::before {
            content: '';
            width: 4px;
            height: 24px;
            background: linear-gradient(180deg, var(--accent) 0%, #a855f7 100%);
            border-radius: 2px;
            flex-shrink: 0;
        }

        /* ===== Anime Grid ===== */
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 1.5rem;
        }

        .anime-card {
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid transparent;
        }
        .anime-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent);
            box-shadow: 0 20px 40px var(--accent-glow);
        }

        .anime-card-image-container { overflow: hidden; position: relative; }

        .anime-card-image {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            transition: transform 0.3s;
            display: block;
        }
        .anime-card:hover .anime-card-image { transform: scale(1.05); }

        .anime-card-score {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.85);
            padding: 0.3rem 0.6rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            backdrop-filter: blur(4px);
        }

        .anime-card-info { padding: 1rem; }

        .anime-card-title {
            font-size: 0.9rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 0.4rem;
        }

        .anime-card-meta { font-size: 0.75rem; color: var(--text-muted); }

        /* ===== Review Cards ===== */
        .reviews-feed { display: flex; flex-direction: column; gap: 1.25rem; }

        .review-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid var(--border);
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .review-card:hover {
            border-color: var(--accent);
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        /* Linha superior: capa + info + nota */
        .review-top {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .review-anime-thumb {
            width: 56px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .review-info { flex: 1; min-width: 0; }

        .review-anime-title {
            font-weight: 700;
            font-size: 1rem;
            color: var(--accent);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 0.2rem;
        }

        /* Avatar + autor */
        .review-author-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.4rem;
        }

        .review-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }

        .review-author-name {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .review-date {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-left: auto;
        }

        /* Estrelas da nota */
        .review-stars {
            display: flex;
            align-items: center;
            gap: 2px;
            margin-top: 0.1rem;
        }
        .review-stars .s { font-size: 1rem; color: var(--star); }
        .review-stars .s.on { color: var(--star-filled); }

        .review-score-badge {
            margin-left: 0.5rem;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--star-filled);
            background: rgba(251, 191, 36, 0.12);
            padding: 0.15rem 0.5rem;
            border-radius: 6px;
        }

        /* Corpo da resenha / spoiler */
        .review-body { margin-bottom: 1rem; }

        .spoiler-box {
            background: rgba(234,179,8,0.07);
            border: 1px solid rgba(234,179,8,0.25);
            border-radius: 10px;
            padding: 0.9rem 1rem;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }
        .spoiler-box:hover { background: rgba(234,179,8,0.12); }

        .spoiler-warning {
            color: var(--warning);
            font-size: 0.82rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-bottom: 0.5rem;
        }

        .spoiler-text {
            font-size: 0.95rem;
            line-height: 1.7;
            color: var(--text-primary);
            transition: filter 0.3s;
        }
        .spoiler-box.blurred .spoiler-text {
            filter: blur(7px);
            pointer-events: none;
        }

        .review-text {
            font-size: 0.95rem;
            line-height: 1.7;
            color: var(--text-primary);
        }

        /* Ações */
        .review-actions {
            display: flex;
            gap: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px solid var(--border);
        }

        .btn {
            padding: 0.45rem 1rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-like {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .btn-like:hover, .btn-like.liked {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        /* ===== Modal ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            backdrop-filter: blur(8px);
        }
        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--bg-secondary);
            border-radius: 20px;
            max-width: 720px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--border);
            animation: slideUp 0.28s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(24px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }

        .modal-header {
            display: flex;
            gap: 1.5rem;
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .modal-image {
            width: 150px;
            border-radius: 12px;
            flex-shrink: 0;
            object-fit: cover;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .modal-info { flex: 1; min-width: 0; }

        .modal-title {
            font-size: 1.45rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
            line-height: 1.3;
        }

        .modal-meta {
            font-size: 0.88rem;
            color: var(--text-secondary);
            margin-bottom: 0.9rem;
        }
        .modal-meta span { margin-right: 0.9rem; }

        .modal-synopsis {
            font-size: 0.88rem;
            line-height: 1.7;
            color: var(--text-secondary);
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .modal-body { padding: 1.5rem; }

        .form-group { margin-bottom: 1.4rem; }

        .form-label {
            display: block;
            margin-bottom: 0.55rem;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .form-input, .form-textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.3s;
        }
        .form-textarea { resize: vertical; min-height: 110px; }
        .form-input:focus, .form-textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .form-input::placeholder, .form-textarea::placeholder { color: var(--text-muted); }

        /* Estrelas interativas do modal */
        .rating-input {
            display: flex;
            gap: 4px;
        }
        .rating-input label {
            font-size: 2.1rem;
            cursor: pointer;
            color: var(--star);
            transition: color 0.12s, transform 0.12s;
            line-height: 1;
            user-select: none;
        }
        .rating-input label:hover,
        .rating-input label.lit {
            color: var(--star-filled);
            transform: scale(1.18);
        }
        .rating-hint {
            margin-top: 0.4rem;
            font-size: 0.82rem;
            color: var(--text-muted);
            min-height: 1.2em;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        .checkbox-label input[type="checkbox"] {
            width: 17px;
            height: 17px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .modal-footer {
            padding: 1.2rem 1.5rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            background: var(--bg-card);
            border-radius: 0 0 20px 20px;
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover { background: var(--bg-card-hover); }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent) 0%, #8b5cf6 100%);
            color: #fff;
            font-weight: 600;
            box-shadow: 0 4px 15px var(--accent-glow);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--accent-glow);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== Estados ===== */
        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }

        .loading-spinner {
            width: 38px;
            height: 38px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }
        .empty-icon { font-size: 2.8rem; margin-bottom: 0.75rem; }

        /* ===== Responsivo ===== */
        @media (max-width: 768px) {
            header { padding: 1rem; }
            .header-content { flex-direction: column; gap: 1rem; }
            .search-container { max-width: 100%; width: 100%; }
            main { padding: 1.25rem 1rem; }
            .anime-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; }
            .modal-header { flex-direction: column; align-items: center; text-align: center; }
            .modal-image { width: 130px; }
            .modal-title { font-size: 1.2rem; }
            .modal-footer { flex-direction: column; }
            .modal-footer .btn { width: 100%; justify-content: center; }
            .review-top { flex-wrap: wrap; }
        }
    </style>
</head>
<body>

    <!-- Toast de sucesso -->
    <div class="toast" id="toast">✅ Resenha enviada com sucesso!</div>

    <!-- ===== Header ===== -->
    <header>
        <div class="header-content">
            <a href="/" class="logo">AniReview</a>
            <div class="search-container">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
                </svg>
                <input type="text" class="search-input" id="searchInput" placeholder="Buscar animes...">
                <button class="search-btn" onclick="searchAnimes()">Buscar</button>
            </div>
        </div>
    </header>

    <!-- ===== Conteúdo ===== -->
    <main>
        <!-- Catálogo -->
        <section class="catalog-section">
            <div class="section-header">
                <h2>Catálogo</h2>
            </div>
            <div class="anime-grid" id="animeGrid">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <div>Carregando animes...</div>
                </div>
            </div>
        </section>

        <!-- Resenhas -->
        <section class="reviews-section">
            <div class="section-header">
                <h2>Resenhas da Comunidade</h2>
            </div>
            <div class="reviews-feed" id="reviewsFeed">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <div>Carregando resenhas...</div>
                </div>
            </div>
        </section>
    </main>

    <!-- ===== Modal ===== -->
    <div class="modal-overlay" id="animeModal" role="dialog" aria-modal="true">
        <div class="modal">
            <div class="modal-header">
                <img class="modal-image" id="modalImage" src="" alt="">
                <div class="modal-info">
                    <h3 class="modal-title" id="modalTitle"></h3>
                    <div class="modal-meta" id="modalMeta"></div>
                    <p class="modal-synopsis" id="modalSynopsis"></p>
                </div>
            </div>

            <div class="modal-body">
                <!-- Nota por estrelas -->
                <div class="form-group">
                    <label class="form-label">Sua Nota</label>
                    <div class="rating-input" id="ratingInput" role="group" aria-label="Selecione uma nota de 1 a 10">
                        <!-- gerado via JS -->
                    </div>
                    <div class="rating-hint" id="ratingHint">Clique em uma estrela para dar a nota</div>
                </div>

                <!-- Nome -->
                <div class="form-group">
                    <label class="form-label" for="usernameInput">Seu Nome</label>
                    <input type="text" class="form-input" id="usernameInput" placeholder="Seu nome (opcional)" maxlength="60">
                </div>

                <!-- Resenha -->
                <div class="form-group">
                    <label class="form-label" for="reviewInput">Sua Resenha</label>
                    <textarea class="form-textarea" id="reviewInput" placeholder="O que você achou deste anime?" maxlength="2000"></textarea>
                </div>

                <!-- Spoiler -->
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="spoilerCheck">
                        <span>⚠️ Esta resenha contém spoilers</span>
                    </label>
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
                <button class="btn btn-primary" id="submitBtn" onclick="submitReview()">Enviar Resenha</button>
            </div>
        </div>
    </div>

    <!-- ===== JavaScript ===== -->
    <script>
        /* ── Globais ── */
        let currentAnime = null;
        let currentRating = 0;

        const KITSU_BASE = 'https://kitsu.io/api/edge';
        const KITSU_HEADERS = { 'Accept': 'application/vnd.api+json' };

        const RATING_LABELS = ['', 'Horrível', 'Muito ruim', 'Ruim', 'Fraco', 'Regular',
                                    'Ok', 'Bom', 'Muito bom', 'Ótimo', 'Obra-prima! ★'];

        /* ── Init ── */
        document.addEventListener('DOMContentLoaded', () => {
            buildStarInput();
            loadPopularAnimes();
            loadReviews();
            document.getElementById('searchInput').addEventListener('keypress', e => {
                if (e.key === 'Enter') searchAnimes();
            });
        });

        /* ════════════════════════════════
           ESTRELAS INTERATIVAS DO MODAL
        ════════════════════════════════ */
        function buildStarInput() {
            const container = document.getElementById('ratingInput');
            container.innerHTML = '';
            for (let i = 1; i <= 10; i++) {
                const lbl = document.createElement('label');
                lbl.textContent = '★';
                lbl.title = `${i} — ${RATING_LABELS[i]}`;
                lbl.addEventListener('click', () => setRating(i));
                lbl.addEventListener('mouseenter', () => highlightStars(i));
                lbl.addEventListener('mouseleave', () => highlightStars(currentRating));
                container.appendChild(lbl);
            }
        }

        function highlightStars(upTo) {
            document.querySelectorAll('#ratingInput label').forEach((lbl, idx) => {
                lbl.classList.toggle('lit', idx < upTo);
            });
            document.getElementById('ratingHint').textContent =
                upTo > 0 ? `${upTo}/10 — ${RATING_LABELS[upTo]}` : 'Clique em uma estrela para dar a nota';
        }

        function setRating(n) {
            currentRating = n;
            highlightStars(n);
        }

        /* ════════════════════════════════
           KITSU API
        ════════════════════════════════ */
        function kitsuScore(raw) {
            if (!raw) return null;
            return (parseFloat(raw) / 10).toFixed(1);
        }

        async function loadPopularAnimes() {
            setGridLoading();
            try {
                const res  = await fetch(`${KITSU_BASE}/anime?page[limit]=20&sort=-userCount`, { headers: KITSU_HEADERS });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                displayAnimes(data.data);
            } catch (err) {
                console.error('Erro ao carregar catálogo:', err);
                setGridError('Não foi possível carregar o catálogo. Verifique sua conexão.');
            }
        }

        async function searchAnimes() {
            const q = document.getElementById('searchInput').value.trim();
            if (!q) { loadPopularAnimes(); return; }

            setGridLoading('Buscando...');
            try {
                const res  = await fetch(
                    `${KITSU_BASE}/anime?filter[text]=${encodeURIComponent(q)}&page[limit]=20`,
                    { headers: KITSU_HEADERS }
                );
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                displayAnimes(data.data);
            } catch (err) {
                console.error('Erro na busca:', err);
                setGridError('Erro na busca. Tente novamente.');
            }
        }

        function displayAnimes(list) {
            const grid = document.getElementById('animeGrid');
            if (!list || list.length === 0) {
                grid.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><div>Nenhum anime encontrado</div></div>`;
                return;
            }
            grid.innerHTML = list.map(item => {
                const a     = item.attributes;
                const title = escapeHtml(a.canonicalTitle || 'Sem título');
                const cover = a.posterImage?.small || 'https://placehold.co/200x300/1f1f26/71717a?text=Sem+Capa';
                const score = kitsuScore(a.averageRating);
                const year  = a.startDate ? a.startDate.slice(0, 4) : '?';
                return `
                <div class="anime-card" onclick="openModal('${item.id}')" tabindex="0"
                     onkeypress="if(event.key==='Enter') openModal('${item.id}')">
                    <div class="anime-card-image-container">
                        <img class="anime-card-image" src="${cover}" alt="${title}" loading="lazy">
                        ${score ? `<div class="anime-card-score">
                            <svg width="11" height="11" viewBox="0 0 24 24" fill="#fbbf24">
                                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                            </svg>${score}</div>` : ''}
                    </div>
                    <div class="anime-card-info">
                        <div class="anime-card-title">${title}</div>
                        <div class="anime-card-meta">${a.subtype || '?'} • ${year}</div>
                    </div>
                </div>`;
            }).join('');
        }

        function setGridLoading(msg = 'Carregando animes...') {
            document.getElementById('animeGrid').innerHTML =
                `<div class="loading"><div class="loading-spinner"></div><div>${msg}</div></div>`;
        }

        function setGridError(msg) {
            document.getElementById('animeGrid').innerHTML =
                `<div class="empty-state"><div class="empty-icon">⚠️</div><div>${msg}</div></div>`;
        }

        /* ════════════════════════════════
           MODAL
        ════════════════════════════════ */
        async function openModal(animeId) {
            try {
                const res  = await fetch(`${KITSU_BASE}/anime/${animeId}`, { headers: KITSU_HEADERS });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const json = await res.json();
                const a    = json.data.attributes;

                currentAnime = {
                    id:       json.data.id,
                    title:    a.canonicalTitle || 'Sem título',
                    image:    a.posterImage?.small || '',
                    synopsis: a.synopsis         || 'Sem sinopse disponível.',
                    score:    kitsuScore(a.averageRating),
                    type:     a.subtype,
                    episodes: a.episodeCount,
                    year:     a.startDate ? a.startDate.slice(0, 4) : null
                };

                document.getElementById('modalImage').src = currentAnime.image;
                document.getElementById('modalImage').alt = currentAnime.title;
                document.getElementById('modalTitle').textContent = currentAnime.title;
                document.getElementById('modalSynopsis').textContent = currentAnime.synopsis;

                const meta = [
                    currentAnime.type     && `<span>${currentAnime.type}</span>`,
                    currentAnime.episodes && `<span>${currentAnime.episodes} eps</span>`,
                    currentAnime.year     && `<span>${currentAnime.year}</span>`,
                    currentAnime.score    && `<span>★ ${currentAnime.score}</span>`,
                ].filter(Boolean).join('');
                document.getElementById('modalMeta').innerHTML = meta;

                resetForm();
                document.getElementById('animeModal').classList.add('active');
                document.getElementById('usernameInput').focus();
            } catch (err) {
                console.error('Erro ao abrir modal:', err);
                alert('Não foi possível carregar os detalhes deste anime.');
            }
        }

        function closeModal() {
            document.getElementById('animeModal').classList.remove('active');
        }

        function resetForm() {
            currentRating = 0;
            highlightStars(0);
            document.getElementById('usernameInput').value  = '';
            document.getElementById('reviewInput').value    = '';
            document.getElementById('spoilerCheck').checked = false;
            document.getElementById('submitBtn').disabled   = false;
            document.getElementById('submitBtn').textContent = 'Enviar Resenha';
        }

        /* ════════════════════════════════
           RESENHAS
        ════════════════════════════════ */
        async function submitReview() {
            if (currentRating === 0) {
                shakeElement(document.getElementById('ratingInput'));
                document.getElementById('ratingHint').textContent = '⚠️ Selecione uma nota antes de enviar!';
                document.getElementById('ratingHint').style.color = 'var(--danger)';
                return;
            }

            const text = document.getElementById('reviewInput').value.trim();
            if (!text) {
                document.getElementById('reviewInput').focus();
                document.getElementById('reviewInput').style.borderColor = 'var(--danger)';
                setTimeout(() => document.getElementById('reviewInput').style.borderColor = '', 1800);
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled   = true;
            btn.textContent = 'Enviando...';

            const payload = {
                animeId:   currentAnime.id,
                animeTitle: currentAnime.title,
                animeImage: currentAnime.image,
                username:   document.getElementById('usernameInput').value.trim() || 'Anônimo',
                rating:     currentRating,
                review:     text,
                hasSpoiler: document.getElementById('spoilerCheck').checked
            };

            try {
                const res = await fetch('/api/reviews', {
                    method:  'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body:    JSON.stringify(payload)
                });

                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.message || `HTTP ${res.status}`);
                }

                closeModal();
                showToast('✅ Resenha enviada com sucesso!');
                await loadReviews();               // atualiza feed sem F5
            } catch (err) {
                console.error('Erro ao enviar resenha:', err);
                btn.disabled    = false;
                btn.textContent = 'Enviar Resenha';
                alert('Erro ao enviar: ' + err.message);
            }
        }

        async function loadReviews() {
            try {
                const res = await fetch('/api/reviews');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const reviews = await res.json();
                displayReviews(reviews);
            } catch (err) {
                console.error('Erro ao carregar resenhas:', err);
                document.getElementById('reviewsFeed').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">⚠️</div>
                        <div>Erro ao carregar resenhas</div>
                        <div style="font-size:0.83rem;margin-top:0.4rem;color:var(--text-muted)">
                            Verifique se o servidor está em http://localhost:8080
                        </div>
                    </div>`;
            }
        }

        function displayReviews(reviews) {
            const feed = document.getElementById('reviewsFeed');

            if (!reviews || reviews.length === 0) {
                feed.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📝</div>
                        <div>Nenhuma resenha ainda</div>
                        <div style="font-size:0.9rem;margin-top:0.4rem">Seja o primeiro a avaliar um anime!</div>
                    </div>`;
                return;
            }

            feed.innerHTML = reviews.map(r => {
                const initial  = (r.username || 'A')[0].toUpperCase();
                const stars    = Array.from({ length: 10 }, (_, i) =>
                    `<span class="s${i < r.rating ? ' on' : ''}">★</span>`
                ).join('');
                const dateStr  = r.createdAt
                    ? new Date(r.createdAt).toLocaleDateString('pt-BR', { day:'2-digit', month:'short', year:'numeric' })
                    : '';
                const imgSrc   = r.animeImage || 'https://placehold.co/56x80/1f1f26/71717a?text=?';

                const bodyHtml = r.hasSpoiler
                    ? `<div class="spoiler-box blurred" onclick="this.classList.toggle('blurred')" title="Clique para revelar">
                            <div class="spoiler-warning">⚠️ Spoiler — clique para revelar</div>
                            <div class="spoiler-text">${escapeHtml(r.review)}</div>
                       </div>`
                    : `<div class="review-text">${escapeHtml(r.review)}</div>`;

                return `
                <div class="review-card">
                    <div class="review-top">
                        <img class="review-anime-thumb" src="${imgSrc}" alt="${escapeHtml(r.animeTitle)}" loading="lazy">
                        <div class="review-info">
                            <div class="review-anime-title">${escapeHtml(r.animeTitle)}</div>
                            <div class="review-author-row">
                                <div class="review-avatar" aria-hidden="true">${initial}</div>
                                <span class="review-author-name">${escapeHtml(r.username || 'Anônimo')}</span>
                                ${dateStr ? `<span class="review-date">${dateStr}</span>` : ''}
                            </div>
                            <div class="review-stars">
                                ${stars}
                                <span class="review-score-badge">${r.rating}/10</span>
                            </div>
                        </div>
                    </div>
                    <div class="review-body">${bodyHtml}</div>
                    <div class="review-actions">
                        <button class="btn btn-like" onclick="likeReview('${r.id}', this)" aria-label="Curtir resenha">
                            ♥ <span class="like-count">${r.likes || 0}</span>
                        </button>
                    </div>
                </div>`;
            }).join('');
        }

        async function likeReview(id, btn) {
            try {
                const res = await fetch(`/api/reviews/${id}/like`, { method: 'POST' });
                if (res.ok) {
                    const data = await res.json();
                    btn.querySelector('.like-count').textContent = data.likes;
                    btn.classList.add('liked');
                }
            } catch (err) { console.error('Erro ao curtir:', err); }
        }

        /* ════════════════════════════════
           UTILITÁRIOS
        ════════════════════════════════ */
        function escapeHtml(str) {
            if (!str) return '';
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3200);
        }

        function shakeElement(el) {
            el.style.animation = 'none';
            el.offsetHeight;   // reflow
            el.style.animation = 'shake 0.4s ease';
        }

        /* ── Fechar modal ── */
        document.getElementById('animeModal').addEventListener('click', e => {
            if (e.target.id === 'animeModal') closeModal();
        });
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeModal();
        });
    </script>

    <style>
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            20%      { transform: translateX(-6px); }
            40%      { transform: translateX(6px); }
            60%      { transform: translateX(-4px); }
            80%      { transform: translateX(4px); }
        }
    </style>
</body>
</html>
