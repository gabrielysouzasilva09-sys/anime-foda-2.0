<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniReview - Plataforma de Animes</title>
    <style>
        /* ===== Reset & Variáveis ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary:    #0d0d0f;
            --bg-secondary:  #16161a;
            --bg-card:       #1f1f26;
            --bg-card-hover: #252530;
            --accent:        #7c3aed;
            --accent-hover:  #8b5cf6;
            --accent-glow:   rgba(124, 58, 237, 0.35);
            --text-primary:  #f4f4f5;
            --text-secondary:#a1a1aa;
            --text-muted:    #71717a;
            --border:        #27272a;
            --star:          #3f3f46;
            --star-filled:   #fbbf24;
            --success:       #22c55e;
            --warning:       #eab308;
            --danger:        #ef4444;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--success);
            color: #fff;
            padding: 0.85rem 1.4rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 8px 30px rgba(34, 197, 94, 0.4);
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            transform: translateY(120%);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .toast.show { transform: translateY(0); }

        /* ===== Header ===== */
        header {
            background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
            border-bottom: 1px solid var(--border);
            padding: 1.25rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 1.75rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent) 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .search-container {
            flex: 1;
            max-width: 480px;
            min-width: 250px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 3rem;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: all 0.3s;
        }
        .search-input::placeholder { color: var(--text-muted); }
        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        .search-btn {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--accent);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: background 0.2s;
        }
        .search-btn:hover { background: var(--accent-hover); }

        /* ===== Main ===== */
        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        section { margin-bottom: 3rem; }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        h2 {
            font-size: 1.4rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        h2::before {
            content: '';
            width: 4px;
            height: 24px;
            background: linear-gradient(180deg, var(--accent) 0%, #a855f7 100%);
            border-radius: 2px;
            flex-shrink: 0;
        }

        /* ===== Anime Grid ===== */
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 1.5rem;
        }

        .anime-card {
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid transparent;
        }
        .anime-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent);
            box-shadow: 0 20px 40px var(--accent-glow);
        }

        .anime-card-image-container { overflow: hidden; position: relative; }

        .anime-card-image {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            transition: transform 0.3s;
            display: block;
        }
        .anime-card:hover .anime-card-image { transform: scale(1.05); }

        .anime-card-score {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.85);
            padding: 0.3rem 0.6rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            backdrop-filter: blur(4px);
        }

        .anime-card-info { padding: 1rem; }

        .anime-card-title {
            font-size: 0.9rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 0.4rem;
        }

        .anime-card-meta { font-size: 0.75rem; color: var(--text-muted); }

        /* ===== Review Cards ===== */
        .reviews-feed { display: flex; flex-direction: column; gap: 1.25rem; }

        .review-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid var(--border);
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .review-card:hover {
            border-color: var(--accent);
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .review-top {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .review-anime-thumb {
            width: 56px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .review-info { flex: 1; min-width: 0; }

        .review-anime-title {
            font-weight: 700;
            font-size: 1rem;
            color: var(--accent);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 0.2rem;
        }

        .review-author-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.4rem;
        }

        .review-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }

        .review-author-name {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .review-date {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-left: auto;
        }

        .review-stars {
            display: flex;
            align-items: center;
            gap: 2px;
            margin-top: 0.1rem;
        }
        .review-stars .s { font-size: 1rem; color: var(--star); }
        .review-stars .s.on { color: var(--star-filled); }

        .review-score-badge {
            margin-left: 0.5rem;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--star-filled);
            background: rgba(251, 191, 36, 0.12);
            padding: 0.15rem 0.5rem;
            border-radius: 6px;
        }

        .review-body { margin-bottom: 1rem; }

        .spoiler-box {
            background: rgba(234,179,8,0.07);
            border: 1px solid rgba(234,179,8,0.25);
            border-radius: 10px;
            padding: 0.9rem 1rem;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }
        .spoiler-box:hover { background: rgba(234,179,8,0.12); }

        .spoiler-warning {
            color: var(--warning);
            font-size: 0.82rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-bottom: 0.5rem;
        }

        .spoiler-text {
            font-size: 0.95rem;
            line-height: 1.7;
            color: var(--text-primary);
            transition: filter 0.3s;
        }
        .spoiler-box.blurred .spoiler-text {
            filter: blur(7px);
            pointer-events: none;
        }

        .review-text {
            font-size: 0.95rem;
            line-height: 1.7;
            color: var(--text-primary);
        }

        .review-actions {
            display: flex;
            gap: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px solid var(--border);
        }

        .btn {
            padding: 0.45rem 1rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-like {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .btn-like:hover, .btn-like.liked {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        /* ===== Modal ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            backdrop-filter: blur(8px);
        }
        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--bg-secondary);
            border-radius: 20px;
            max-width: 720px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--border);
            animation: slideUp 0.28s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(24px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }

        .modal-header {
            display: flex;
            gap: 1.5rem;
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .modal-image {
            width: 150px;
            border-radius: 12px;
            flex-shrink: 0;
            object-fit: cover;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .modal-info { flex: 1; min-width: 0; }

        .modal-title {
            font-size: 1.45rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
            line-height: 1.3;
        }

        .modal-meta {
            font-size: 0.88rem;
            color: var(--text-secondary);
            margin-bottom: 0.9rem;
        }
        .modal-meta span { margin-right: 0.9rem; }

        .modal-synopsis {
            font-size: 0.88rem;
            line-height: 1.7;
            color: var(--text-secondary);
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .modal-body { padding: 1.5rem; }

        .form-group { margin-bottom: 1.4rem; }

        .form-label {
            display: block;
            margin-bottom: 0.55rem;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .form-input, .form-textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.3s;
        }
        .form-textarea { resize: vertical; min-height: 110px; }
        .form-input:focus, .form-textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .form-input::placeholder, .form-textarea::placeholder { color: var(--text-muted); }

        .rating-input {
            display: flex;
            gap: 4px;
        }
        .rating-input label {
            font-size: 2.1rem;
            cursor: pointer;
            color: var(--star);
            transition: color 0.12s, transform 0.12s;
            line-height: 1;
            user-select: none;
        }
        .rating-input label:hover,
        .rating-input label.lit {
            color: var(--star-filled);
            transform: scale(1.18);
        }
        .rating-hint {
            margin-top: 0.4rem;
            font-size: 0.82rem;
            color: var(--text-muted);
            min-height: 1.2em;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        .checkbox-label input[type="checkbox"] {
            width: 17px;
            height: 17px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .modal-footer {
            padding: 1.2rem 1.5rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            background: var(--bg-card);
            border-radius: 0 0 20px 20px;
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover { background: var(--bg-card-hover); }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent) 0%, #8b5cf6 100%);
            color: #fff;
            font-weight: 600;
            box-shadow: 0 4px 15px var(--accent-glow);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--accent-glow);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== Estados ===== */
        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }

        .loading-spinner {
            width: 38px;
            height: 38px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }
        .empty-icon { font-size: 2.8rem; margin-bottom: 0.75rem; }

        /* ===== Tabs ===== */
        .modal-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            padding: 0 1.5rem;
            gap: 0;
        }
        .modal-tab {
            padding: 0.75rem 1.25rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border: none;
            background: none;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            margin-bottom: -1px;
        }
        .modal-tab:hover { color: var(--text-primary); }
        .modal-tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        /* ===== Painel Episódios ===== */
        .episodes-panel { padding: 1.5rem; }

        /* Dropdown de temporada */
        .seasons-bar {
            margin-bottom: 1.25rem;
            position: relative;
        }

        .season-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 0.7rem 1rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            user-select: none;
        }
        .season-btn:hover {
            border-color: var(--accent);
            background: var(--bg-card-hover);
        }
        .season-btn.open {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
            border-bottom-left-radius: 4px;
            border-bottom-right-radius: 4px;
        }

        .season-btn-arrow {
            flex-shrink: 0;
            width: 18px;
            height: 18px;
            color: var(--text-muted);
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .season-btn.open .season-btn-arrow {
            transform: rotate(180deg);
            color: var(--accent);
        }

        .season-btn-label {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .season-dropdown {
            position: absolute;
            top: calc(100% - 1px);
            left: 0;
            right: 0;
            background: var(--bg-card);
            border: 1px solid var(--accent);
            border-top: none;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            overflow: hidden;
            z-index: 200;
            box-shadow: 0 12px 32px rgba(0,0,0,0.45);
            transform-origin: top center;
            animation: dropdownOpen 0.18s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes dropdownOpen {
            from { opacity: 0; transform: scaleY(0.88); }
            to   { opacity: 1; transform: scaleY(1); }
        }

        .season-option {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.7rem 1rem;
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            border-bottom: 1px solid var(--border);
        }
        .season-option:last-child { border-bottom: none; }
        .season-option:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }
        .season-option.active {
            color: var(--accent);
            font-weight: 700;
            background: rgba(124, 58, 237, 0.08);
        }
        .season-option.active::after {
            content: '✓';
            margin-left: auto;
            font-size: 0.85rem;
            color: var(--accent);
        }

        /* Lista de episódios */
        .episodes-list {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .episode-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.7rem 0.9rem;
            background: var(--bg-card);
            border-radius: 10px;
            border: 1px solid var(--border);
            transition: border-color 0.2s;
        }
        .episode-row:hover { border-color: var(--accent); }

        .episode-num {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--accent);
            min-width: 2rem;
            text-align: center;
            background: rgba(124,58,237,0.12);
            border-radius: 6px;
            padding: 0.2rem 0.4rem;
            flex-shrink: 0;
        }

        .episode-title {
            flex: 1;
            font-size: 0.88rem;
            color: var(--text-primary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .episode-avg {
            font-size: 0.78rem;
            color: var(--star-filled);
            font-weight: 600;
            min-width: 3.5rem;
            text-align: right;
            flex-shrink: 0;
        }

        .episode-nota-select {
            padding: 0.3rem 0.5rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 0.82rem;
            cursor: pointer;
            flex-shrink: 0;
            min-width: 70px;
            transition: border-color 0.2s;
        }
        .episode-nota-select:focus {
            outline: none;
            border-color: var(--accent);
        }
        .episode-nota-select.rated {
            border-color: var(--star-filled);
            color: var(--star-filled);
        }

        .episode-save-btn {
            padding: 0.3rem 0.7rem;
            border-radius: 8px;
            border: none;
            background: var(--accent);
            color: #fff;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.18s, transform 0.1s;
        }
        .episode-save-btn:hover { background: var(--accent-hover); transform: scale(1.04); }
        .episode-save-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .episode-save-btn.saved { background: var(--success); }

        .episodes-loading {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
        }
        .episodes-loading .loading-spinner {
            margin: 0 auto 0.75rem;
        }

        /* ===== Responsivo ===== */
        @media (max-width: 768px) {
            header { padding: 1rem; }
            .header-content { flex-direction: column; gap: 1rem; }
            .search-container { max-width: 100%; width: 100%; }
            main { padding: 1.25rem 1rem; }
            .anime-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; }
            .modal-header { flex-direction: column; align-items: center; text-align: center; }
            .modal-image { width: 130px; }
            .modal-title { font-size: 1.2rem; }
            .modal-footer { flex-direction: column; }
            .modal-footer .btn { width: 100%; justify-content: center; }
            .review-top { flex-wrap: wrap; }
            .episode-row { flex-wrap: wrap; gap: 0.5rem; }
            .episode-title { min-width: 100%; order: -1; }
        }

        @keyframes shake {
            0%,100% { transform: translateX(0); }

        }

        .genre-bar-inner {
            max-width: 1400px;

            display: flex;
            align-items: center;
            gap: 0.5rem;
            white-space: nowrap;

        .genre-chip {

            gap: 0.35rem;

            border-color: var(--accent);
            background: var(--accent);
            color: #fff;
            box-shadow: 0 2px 10px var(--accent-glow);
        }

        /* ===== Skeleton Loader ===== */
        @keyframes shimmer {
            0%   { background-position: -600px 0; }
            100% { background-position:  600px 0; }
        }

        .skeleton {
            background: linear-gradient(90deg,
                var(--bg-card) 25%,
                var(--bg-card-hover) 50%,
                var(--bg-card) 75%);
            background-size: 600px 100%;
            animation: shimmer 1.4s infinite linear;
            border-radius: 8px;

        .skeleton-card {

        .skeleton-card-image {

    <!-- ===== JavaScript ===== -->
    <script>

        reg(m, '244', [

    /* ════════════════════════════════════════════════════════════
       LOCAL STORAGE — HELPERS
    ════════════════════════════════════════════════════════════ */

    function lsGet(key, def = []) {
        try {
            const raw = localStorage.getItem(key);
            return raw ? JSON.parse(raw) : def;
        } catch { return def; }
    }

    function lsSet(key, value) {
        try { localStorage.setItem(key, JSON.stringify(value)); } catch(e) {
            console.warn('localStorage indisponível:', e);
        }
    }

    /* Resenhas */
    function getReviews()           { return lsGet(LS_REVIEWS, []); }
    function saveReviews(reviews)   { lsSet(LS_REVIEWS, reviews); }

    /* Notas de episódios: { [epKey]: { [userName]: nota } } */
    function getEpRatings()         { return lsGet(LS_EP_RATINGS, {}); }
    function saveEpRatings(ratings) { lsSet(LS_EP_RATINGS, ratings); }

    /* Curtidas: { [reviewId]: true } */
    function getLikes()             { return lsGet(LS_LIKES, {}); }
    function saveLikes(likes)       { lsSet(LS_LIKES, likes); }

    /* Episódios vistos: { [epKey]: true }  (epKey = "kitsuId-numero") */
    function getSeenEps()           { return lsGet(LS_SEEN, {}); }
    function saveSeenEps(seen)      { lsSet(LS_SEEN, seen); }

    /* ════════════════════════════════════════════════════════════
       INIT
    ════════════════════════════════════════════════════════════ */
    document.addEventListener('DOMContentLoaded', () => {
        buildStarInput();
        loadPopularAnimes();
        renderReviewsFeed();

        // Debounce na busca: dispara automaticamente 400ms após o utilizador parar de digitar
        let _searchDebounce;
        const searchEl = document.getElementById('searchInput');
        searchEl.addEventListener('input', () => {
            clearTimeout(_searchDebounce);
            _searchDebounce = setTimeout(() => searchAnimes(), 400);
        });
        searchEl.addEventListener('keydown', e => {
            if (e.key === 'Enter') { clearTimeout(_searchDebounce); searchAnimes(); }
        });

        const epInput = document.getElementById('epUsernameInput');
        if (epInput) {
            let debounce;
            epInput.addEventListener('input', () => {
                clearTimeout(debounce);
                debounce = setTimeout(() => {
                    if (currentSeasonKitsuId) renderEpisodesForSeason(currentSeasonKitsuId);
                }, 400);
            });
        }
    });

    /* ════════════════════════════════════════════════════════════
       ESTRELAS INTERATIVAS
    ════════════════════════════════════════════════════════════ */
    function buildStarInput() {
        const container = document.getElementById('ratingInput');
        container.innerHTML = '';
        for (let i = 1; i <= 10; i++) {
            const lbl = document.createElement('label');
            lbl.textContent = '★';
            lbl.title = `${i} — ${RATING_LABELS[i]}`;
            lbl.addEventListener('click', () => setRating(i));
            lbl.addEventListener('mouseenter', () => highlightStars(i));
            lbl.addEventListener('mouseleave', () => highlightStars(currentRating));
            container.appendChild(lbl);
        }
    }

    function highlightStars(upTo) {
        document.querySelectorAll('#ratingInput label').forEach((lbl, idx) => {
            lbl.classList.toggle('lit', idx < upTo);
        });
        document.getElementById('ratingHint').textContent =
            upTo > 0 ? `${upTo}/10 — ${RATING_LABELS[upTo]}` : 'Clique em uma estrela para dar a nota';
    }

    function setRating(n) {
        currentRating = n;
        highlightStars(n);
    }

    /* ════════════════════════════════════════════════════════════
       KITSU API — CATÁLOGO
    ════════════════════════════════════════════════════════════ */
    function kitsuScore(raw) {
        if (!raw) return null;
        return (parseFloat(raw) / 10).toFixed(1);
    }

    async function loadPopularAnimes() {
        setGridLoading();
        try {
            const res  = await fetch(`${KITSU_BASE}/anime?page[limit]=20&sort=-userCount`, { headers: KITSU_HEADERS });

    /* ════════════════════════════════════════════════════════════
       KITSU API — TEMPORADAS (detecção dinâmica via media-relationships)
    ════════════════════════════════════════════════════════════ */

    /* ════════════════════════════════════════════════════════════
       KITSU — DETECÇÃO DINÂMICA DE TEMPORADAS
       Estratégia de 3 camadas para máxima robustez:
         1. Mapa manual (ANIME_SEASONS_MAP) — resposta instantânea
         2. Endpoint /anime/:id/relationships/sequels  (mais fiável)
         3. Fallback: endpoint media-relationships com include
    ════════════════════════════════════════════════════════════ */

    /**
     * Busca os sequels DIRECTOS de um anime via o endpoint
     * GET /anime/:id/relationships/sequels
     * Retorna array de IDs (strings).
     */
    async function kitsuGetSequels(animeId) {
        try {
            const res = await fetch(
                `${KITSU_BASE}/anime/${animeId}/relationships/sequels`,
                { headers: KITSU_HEADERS }
            );
            if (!res.ok) return [];
            const body = await res.json();
            return (body.data || []).map(d => String(d.id));
        } catch { return []; }
    }

    /**
     * Busca os prequels DIRECTOS de um anime via o endpoint
     * GET /anime/:id/relationships/prequels
     * Retorna array de IDs (strings).
     */
    async function kitsuGetPrequels(animeId) {
        try {
            const res = await fetch(
                `${KITSU_BASE}/anime/${animeId}/relationships/prequels`,
                { headers: KITSU_HEADERS }
            );
            if (!res.ok) return [];
            const body = await res.json();
            return (body.data || []).map(d => String(d.id));
        } catch { return []; }
    }

    /**
     * Fallback: usa media-relationships com include para obter
     * sequels/prequels quando os endpoints directos falham.
     * Retorna { sequels: [id,...], prequels: [id,...] }
     */
    async function kitsuGetRelationshipsFallback(animeId) {
        try {
            const res = await fetch(
                `${KITSU_BASE}/media-relationships` +
                `?filter[source_id]=${animeId}&filter[source_type]=Anime` +
                `&include=destination&page[limit]=20`,
                { headers: KITSU_HEADERS }
            );
            if (!res.ok) return { sequels: [], prequels: [] };
            const body   = await res.json();
            const result = { sequels: [], prequels: [] };
            for (const rel of (body.data || [])) {
                const role     = (rel.attributes?.role || '').toLowerCase();
                const destData = rel.relationships?.destination?.data;
                if (!destData) continue;
                const destId   = String(destData.id || '');
                const destType = (destData.type || '').toLowerCase();
                if (!destType.includes('anime')) continue;
                if (role === 'sequel')  result.sequels.push(destId);
                if (role === 'prequel') result.prequels.push(destId);
            }
            return result;
        } catch { return { sequels: [], prequels: [] }; }
    }

    /**
     * Busca sequels com fallback automático:
     * Tenta /relationships/sequels primeiro, depois media-relationships.
     */
    async function getSequels(animeId) {
        const direct = await kitsuGetSequels(animeId);
        if (direct.length > 0) return direct;
        const fb = await kitsuGetRelationshipsFallback(animeId);
        return fb.sequels;
    }

    /**
     * Busca prequels com fallback automático.
     */
    async function getPrequels(animeId) {
        const direct = await kitsuGetPrequels(animeId);
        if (direct.length > 0) return direct;
        const fb = await kitsuGetRelationshipsFallback(animeId);
        return fb.prequels;
    }

    /**
     * Navega para trás via prequels para encontrar a T1 (root).
     */
    async function findRootAnime(animeId) {
        let rootId  = String(animeId);
        const visited = new Set();
        for (let i = 0; i < 8; i++) {
            if (visited.has(rootId)) break;
            visited.add(rootId);
            const prequels = await getPrequels(rootId);
            if (!prequels.length) break;
            rootId = prequels[0];
        }
        return rootId;
    }

    /**
     * A partir do root, percorre sequels para montar a chain completa.
     * Retorna array de { kitsuId, subtype, title } — inclui TV E não-TV,
     * para que detectKitsuSeasons possa gerar labels correctos para cada tipo.
     */
    async function buildSeasonChain(rootId) {
        // Busca info do root (subtype + título canónico)
        const rootInfo = await kitsuGetInfo(rootId);
        const chain    = [{ kitsuId: rootId, subtype: rootInfo.subtype, title: rootInfo.title }];
        const seen     = new Set([rootId]);
        let   cursor   = rootId;

        for (let i = 0; i < 14; i++) {
            const sequels = await getSequels(cursor);
            if (!sequels.length) break;

            // Busca info de todos os sequels em paralelo
            const infos = await Promise.all(sequels.map(s => kitsuGetInfo(s)));

            let advanced = false;
            for (let j = 0; j < sequels.length; j++) {
                const sid  = sequels[j];
                if (seen.has(sid)) continue;
                seen.add(sid);

                chain.push({ kitsuId: sid, subtype: infos[j].subtype, title: infos[j].title });

                // Avança o cursor apenas em entradas TV/web (ignora OVAs/Filmes como "fim da chain")
                const NON_TV_CURSOR = new Set(['ova', 'ona', 'movie', 'special', 'music']);
                if (!NON_TV_CURSOR.has(infos[j].subtype)) {
                    cursor  = sid;
                    advanced = true;
                    break;
                }
            }
            if (!advanced) break;
        }

        return chain;
    }

    /**
     * Busca subtype + título canónico de um anime na Kitsu com cache.
     * Retorna { subtype: 'tv'|'ova'|'movie'|'special'|..., title: string }
     */
    async function kitsuGetInfo(animeId) {
        if (_subtypeCache[animeId]) return _subtypeCache[animeId];
        try {
            const res = await fetch(
                `${KITSU_BASE}/anime/${animeId}?fields[anime]=subtype,canonicalTitle`,
                { headers: KITSU_HEADERS }
            );
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const json  = await res.json();
            const attrs = json.data?.attributes || {};
            const info  = {
                subtype: (attrs.subtype || 'TV').toLowerCase(),
                title:   attrs.canonicalTitle || '',
            };
            _subtypeCache[animeId] = info;
            return info;
        } catch {
            const fallback = { subtype: 'tv', title: '' };
            _subtypeCache[animeId] = fallback;
            return fallback;
        }
    }

    // Mantém kitsuGetSubtype como alias simples (compatibilidade)
    async function kitsuGetSubtype(animeId) {
        return (await kitsuGetInfo(animeId)).subtype;
    }

    /**
     * Detecção dinâmica de temporadas via Kitsu.
     * Retorna [{label, kitsuId}] ou [] para série única (sem dropdown).
     *
     * Labels gerados por subtype:
     *   TV/web  → "1ª Temporada", "2ª Temporada", ... (contador próprio)
     *   movie   → "Filme" (ou "Filme 2", "Filme 3" se houver múltiplos)
     *   ova     → "OVA" / "OVA 2" ...
     *   special → "Especial" / "Especial 2" ...
     *   ona     → "ONA" / "ONA 2" ...
     *
     * O contador de "Xª Temporada" incrementa APENAS para TV/web.
     */
    async function detectKitsuSeasons(animeId) {
        const id = String(animeId);
        if (_seasonsCache[id] !== undefined) return _seasonsCache[id];
        _seasonsCache[id] = null;  // marca em progresso

        try {
            const rootId    = await findRootAnime(id);
            const chainInfo = await buildSeasonChain(rootId);  // [{kitsuId, subtype, title}]

            const ordinals  = ['1ª','2ª','3ª','4ª','5ª','6ª','7ª','8ª','9ª','10ª','11ª','12ª'];

            // Contadores separados por tipo
            const counters  = { tv: 0, web: 0, movie: 0, ova: 0, special: 0, ona: 0 };

            const seasons = chainInfo.map(entry => {
                const sub = entry.subtype;  // já em lowercase

                let label;
                if (sub === 'tv' || sub === 'web') {
                    counters.tv++;
                    const ord = ordinals[counters.tv - 1] || (counters.tv + 'ª');
                    label = `${ord} Temporada`;
                } else if (sub === 'movie') {
                    counters.movie++;
                    label = counters.movie > 1 ? `Filme ${counters.movie}` : 'Filme';
                } else if (sub === 'ova') {
                    counters.ova++;
                    label = counters.ova > 1 ? `OVA ${counters.ova}` : 'OVA';
                } else if (sub === 'special') {
                    counters.special++;
                    label = counters.special > 1 ? `Especial ${counters.special}` : 'Especial';
                } else if (sub === 'ona') {
                    counters.ona++;
                    label = counters.ona > 1 ? `ONA ${counters.ona}` : 'ONA';
                } else {
                    counters.tv++;  // fallback: assume TV
                    const ord = ordinals[counters.tv - 1] || (counters.tv + 'ª');
                    label = `${ord} Temporada`;
                }

                return { label, kitsuId: entry.kitsuId, subtype: sub };
            });

            // Série única sem dropdown
            const result = seasons.length <= 1 ? [] : seasons;

            // Cache para todos os IDs da chain
            for (const entry of chainInfo) {
                _seasonsCache[entry.kitsuId] = result;
            }

            console.log(`[Temporadas] Anime ${id} → ${result.length || 1} entrada(s):`,
                result.map(s => `${s.label} [${s.subtype}] (${s.kitsuId})`));

            return result;
        } catch (err) {
            console.warn('[Temporadas] Falhou para', animeId, err);
            _seasonsCache[id] = [];
            return [];
        }
    }

    /**
     * Retorna as temporadas de um anime.
     * Prioridade: mapa manual → detecção dinâmica Kitsu.
     */
    async function getSeasonsForAnime(animeId) {
        const entry = ANIME_SEASONS_MAP[String(animeId)];
        if (entry) {
            console.log(`[Temporadas] Anime ${animeId} → mapa manual (${entry.seasons.length} temporada(s))`);
            return entry.seasons;
        }
        return await detectKitsuSeasons(animeId);
    }

    /* ════════════════════════════════════════════════════════════
       KITSU API — EPISÓDIOS
    ════════════════════════════════════════════════════════════ */

    /**
     * Busca TODOS os episódios de um kitsuId directamente na Kitsu API.
     * Paginação automática sem limite de páginas — percorre todos os
     * links "next" até esgotar, garantindo séries longas como One Piece.
     *
     * Kitsu aceita page[limit] até 20 por request na rota /episodes.
     * Usamos o máximo permitido (20) e seguimos os links automáticos.
     *
     * Retorna [{numero, titulo}] ordenado por número.
     * Usa cache de sessão — chamadas repetidas para o mesmo ID são grátis.
     */
    async function fetchKitsuEpisodes(kitsuId, epStart = null, epEnd = null) {
        // Chave de cache inclui range para sagas
        const cacheKey = epStart != null ? `${kitsuId}:${epStart}-${epEnd}` : kitsuId;
        if (_episodesCache[cacheKey]) return _episodesCache[cacheKey];

        // Se os episódios base já foram buscados, apenas filtra
        const baseKey = String(kitsuId);
        if (!_episodesCache[baseKey]) {
            // Busca completa: percorre TODAS as páginas sem limite
            const episodes = [];
            let   url      = `${KITSU_BASE}/anime/${kitsuId}/episodes?page[limit]=20&sort=number`;
            let   attempts = 0;
            const MAX_PAGES = 200;  // tecto de segurança: 200 × 20 = 4000 eps

            while (url && attempts < MAX_PAGES) {
                attempts++;
                try {
                    const res = await fetch(url, { headers: KITSU_HEADERS });
                    if (!res.ok) break;
                    const data  = await res.json();
                    const items = data.data || [];
                    if (!items.length) break;

                    for (const ep of items) {
                        const a      = ep.attributes || {};
                        const titles = a.titles || {};
                        const titulo = titles.pt_br
                                    || titles.pt
                                    || a.canonicalTitle
                                    || titles.en
                                    || titles.en_us
                                    || '';
                        const num = a.number ?? (episodes.length + 1);
                        episodes.push({ numero: num, titulo });
                    }

                    url = data.links?.next || null;
                } catch (err) {
                    console.warn(`[Episódios] Falha na página ${attempts} de ${kitsuId}:`, err);
                    break;
                }
            }

            // Ordena por número (garante ordem mesmo se a API não respeitar)
            episodes.sort((a, b) => a.numero - b.numero);

            _episodesCache[baseKey] = episodes;
            console.log(`[Episódios] ${kitsuId}: ${episodes.length} eps carregados (${attempts} páginas)`);
        }

        // Aplica filtro de range para sagas (ex: One Piece)
        let result = _episodesCache[baseKey];
        if (epStart != null) {
            result = result.filter(ep => ep.numero >= epStart && ep.numero <= epEnd);
        }

        _episodesCache[cacheKey] = result;
        return result;
    }

    /** Actualiza o bloco de metadados do modal com os dados actuais. */
    function updateModalMeta() {
        // Badge de episódios totais (actualizado dinamicamente após carregar episódios)
        let episodesTag = '';
        if (currentAnime.totalEpisodes != null) {
            const n = currentAnime.totalEpisodes;
            episodesTag = `<span>📺 ${n} ${n === 1 ? 'episódio' : 'episódios'}</span>`;
        } else {
            episodesTag = `<span id="metaEpsLoading" style="color:var(--text-muted);font-size:0.8rem">⏳ a contar episódios...</span>`;
        }

        document.getElementById('modalMeta').innerHTML = [
            currentAnime.type  && `<span>${currentAnime.type}</span>`,
            currentAnime.year  && `<span>${currentAnime.year}</span>`,
            currentAnime.score && `<span>★ ${currentAnime.score}</span>`,
            episodesTag,
        ].filter(Boolean).join('');
    }

    async function openModal(animeId) {
        try {
            // Abre o modal imediatamente com os dados do anime (sem esperar temporadas)
            const res = await fetch(`${KITSU_BASE}/anime/${animeId}`, { headers: KITSU_HEADERS });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const json = await res.json();
            const a    = json.data.attributes;

            currentKitsuSeasons = [];
            currentAnime = {
                id:       String(animeId),
                title:    a.canonicalTitle || 'Sem título',
                image:    a.posterImage?.small || '',
                synopsis: a.synopsis || 'Sem sinopse disponível.',
                score:    kitsuScore(a.averageRating),
                type:     a.subtype,
                episodes: a.episodeCount,
                year:     a.startDate ? a.startDate.slice(0, 4) : null,
                totalEpisodes: null,  // preenchido dinamicamente após carregar episódios
            };

            document.getElementById('modalImage').src = currentAnime.image;
            document.getElementById('modalImage').alt = currentAnime.title;
            document.getElementById('modalTitle').textContent    = currentAnime.title;
            document.getElementById('modalSynopsis').textContent = currentAnime.synopsis;

            updateModalMeta();
            resetForm();
            document.getElementById('animeModal').classList.add('active');
            document.getElementById('usernameInput').focus();

            // Busca temporadas de forma assíncrona — actualiza o modal quando chegar
            getSeasonsForAnime(animeId).then(seasons => {
                // Verifica se o modal ainda é o mesmo anime (utilizador pode ter fechado)
                if (!currentAnime || currentAnime.id !== String(animeId)) return;

                currentKitsuSeasons = seasons;

                // Actualiza o meta (o total de episódios será atribuído quando os eps carregarem)
                updateModalMeta();

                // Se a tab de episódios já estiver aberta, reconstrói o dropdown
                const panelEp = document.getElementById('panelEpisodes');
                if (panelEp && panelEp.style.display !== 'none') {
                    document.getElementById('seasonsBar').innerHTML = '';
                    const oldBtn = document.getElementById('seasonDropdownBtn');
                    if (oldBtn) oldBtn.remove();
                    initSeasonSelect();
                }
            });

        } catch (err) {
            console.error('Erro ao abrir modal:', err);
            alert('Não foi possível carregar os detalhes deste anime.');
        }
    }

    function closeModal() {
        closeSeasonDropdown();
        document.getElementById('animeModal').classList.remove('active');
        currentAnime = null;
    }

    function resetForm() {
        currentRating          = 0;
        currentSeasonKitsuId   = null;
        currentKitsuSeasons    = [];
        highlightStars(0);
        document.getElementById('usernameInput').value   = '';
        document.getElementById('reviewInput').value     = '';
        document.getElementById('spoilerCheck').checked  = false;
        document.getElementById('submitBtn').disabled    = false;
        document.getElementById('submitBtn').textContent = 'Enviar Resenha';
        switchTab('review');
        document.getElementById('seasonsBar').innerHTML  = '';
        document.getElementById('episodesList').innerHTML =
            '<div class="episodes-loading"><div class="loading-spinner"></div><div>Carregando temporadas...</div></div>';
    }

    /* ════════════════════════════════════════════════════════════
       TABS DO MODAL
    ════════════════════════════════════════════════════════════ */
    function switchTab(tab) {
        const isEp = tab === 'episodes';
        document.getElementById('panelReview').style.display   = isEp ? 'none' : '';
        document.getElementById('panelEpisodes').style.display = isEp ? '' : 'none';
        document.getElementById('tabReview').classList.toggle('active',  !isEp);
        document.getElementById('tabEpisodes').classList.toggle('active', isEp);

        if (isEp && currentAnime && !document.getElementById('seasonDropdownBtn')) {
            initSeasonSelect();
        }
    }

    /* ════════════════════════════════════════════════════════════
       SELETOR DE TEMPORADAS
    ════════════════════════════════════════════════════════════ */

    function initSeasonSelect() {
        const bar = document.getElementById('seasonsBar');
        bar.innerHTML = '';

        if (currentKitsuSeasons.length === 0) {
            // Série única — carrega o anime directamente sem dropdown
            renderEpisodesForSeason({ kitsuId: currentAnime.id });

            // Se as temporadas ainda não chegaram (cache null), aguarda
            if (_seasonsCache[currentAnime.id] === null || _seasonsCache[currentAnime.id] === undefined) {
                bar.innerHTML = `<div style="font-size:0.82rem;color:var(--text-muted);padding:0.4rem 0">
                    ⏳ A detetar temporadas...</div>`;
                getSeasonsForAnime(currentAnime.id).then(seasons => {
                    if (!currentAnime) return;
                    if (seasons.length > 1) {
                        currentKitsuSeasons = seasons;
                        bar.innerHTML = '';
                        buildSeasonDropdown(bar, seasons, 0, season => {
                            renderEpisodesForSeason(season);
                        });
                        updateModalMeta();
                    } else {
                        bar.innerHTML = '';
                    }
                });
            }
            return;
        }

        // Multi-temporada / sagas: monta dropdown
        // Selecciona a temporada cujo kitsuId corresponde ao anime clicado (ou a 1ª)
        const activeKitsuId = String(currentAnime.id);
        const defaultIdx    = currentKitsuSeasons.findIndex(s => s.kitsuId === activeKitsuId);
        const defaultSeason = currentKitsuSeasons[defaultIdx >= 0 ? defaultIdx : 0];

        buildSeasonDropdown(bar, currentKitsuSeasons, defaultIdx >= 0 ? defaultIdx : 0, season => {
            renderEpisodesForSeason(season);
        });
        renderEpisodesForSeason(defaultSeason);
    }

    /**
     * Retorna o emoji correcto para um subtype.
     */
    function subtypeIcon(subtype) {
        const s = (subtype || 'tv').toLowerCase();
        if (s === 'movie')   return '🎬';
        if (s === 'ova')     return '📼';
        if (s === 'special') return '⭐';
        if (s === 'ona')     return '🌐';
        return '📺';  // TV / web / default
    }

    /**
     * Constrói o dropdown personalizado de temporadas com seta ▼/▲.
     * activeIdx: índice numérico da opção pré-seleccionada (0-based).
     * onSelect(season): callback recebe o objecto season completo {label, kitsuId, epStart?, epEnd?, subtype?}
     */
    function buildSeasonDropdown(container, seasons, activeIdx, onSelect) {
        const idx0    = typeof activeIdx === 'number' ? activeIdx : 0;
        const active  = seasons[idx0] || seasons[0];
        const activeLabel = active ? (active.label || 'Temporada') : 'Temporadas';
        const activeIcon  = active ? subtypeIcon(active.subtype) : '📺';

        const btn = document.createElement('button');
        btn.type      = 'button';
        btn.className = 'season-btn';
        btn.id        = 'seasonDropdownBtn';
        btn.setAttribute('aria-haspopup', 'listbox');
        btn.setAttribute('aria-expanded', 'false');
        btn.innerHTML = `
            <span class="season-btn-label">${activeIcon} ${escapeHtml(activeLabel)}</span>
            <span class="season-btn-arrow" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"/>
                </svg>
            </span>`;

        function closeDropdown() {
            const existing = document.getElementById('seasonDropdownList');
            if (existing) existing.remove();
            btn.classList.remove('open');
            btn.setAttribute('aria-expanded', 'false');
            // Sincroniza label do botão com a opção activa
            const cur = container.querySelector('.season-option.active');
            if (cur) {
                const lbl = btn.querySelector('.season-btn-label');
                if (lbl) lbl.textContent = cur.textContent.trim();
            }
        }

        function openDropdown() {
            if (document.getElementById('seasonDropdownList')) { closeDropdown(); return; }

            btn.classList.add('open');
            btn.setAttribute('aria-expanded', 'true');

            const list = document.createElement('ul');
            list.className = 'season-dropdown';
            list.id        = 'seasonDropdownList';
            list.setAttribute('role', 'listbox');

            seasons.forEach((s, i) => {
                const label = s.label || 'Temporada';
                const icon  = subtypeIcon(s.subtype);
                const li    = document.createElement('li');
                li.className = `season-option${i === idx0 ? ' active' : ''}`;
                li.setAttribute('role', 'option');
                li.setAttribute('aria-selected', i === idx0 ? 'true' : 'false');
                li.setAttribute('data-idx', i);
                li.textContent = `${icon} ${label}`;

                li.addEventListener('click', () => {
                    btn.querySelector('.season-btn-label').textContent = `${icon} ${label}`;
                    list.querySelectorAll('.season-option').forEach(el => {
                        el.classList.remove('active');
                        el.setAttribute('aria-selected', 'false');
                    });
                    li.classList.add('active');
                    li.setAttribute('aria-selected', 'true');
                    closeDropdown();
                    onSelect(s);  // passa o objecto season completo
                });
                list.appendChild(li);
            });

            container.appendChild(list);

            setTimeout(() => {
                document.addEventListener('click', function handler(e) {
                    if (!container.contains(e.target)) {
                        closeDropdown();
                        document.removeEventListener('click', handler);
                    }
                });
            }, 0);
        }

        btn.addEventListener('click', e => { e.stopPropagation(); openDropdown(); });
        container.appendChild(btn);
    }

    function closeSeasonDropdown() {
        const drop = document.getElementById('seasonDropdownList');
        if (drop) drop.remove();
        const btn = document.getElementById('seasonDropdownBtn');
        if (btn) { btn.classList.remove('open'); btn.setAttribute('aria-expanded', 'false'); }
    }

    /* ════════════════════════════════════════════════════════════
       EPISÓDIOS — BUSCA E RENDERIZAÇÃO
    ════════════════════════════════════════════════════════════ */

    /**
     * Carrega e renderiza episódios para uma temporada/saga.
     * @param {object|string} season — objecto {kitsuId, epStart?, epEnd?, label?} ou string kitsuId
     */
    async function renderEpisodesForSeason(season) {
        // Aceita tanto string como objecto
        const kitsuId = typeof season === 'string' ? season : season.kitsuId;
        const epStart = typeof season === 'object' ? (season.epStart ?? null) : null;
        const epEnd   = typeof season === 'object' ? (season.epEnd   ?? null) : null;

        currentSeasonKitsuId = kitsuId;
        const listEl = document.getElementById('episodesList');

        const sagaLabel = (typeof season === 'object' && season.label) ? season.label : null;
        const loadMsg   = sagaLabel ? `A carregar ${escapeHtml(sagaLabel)}...` : 'Carregando episódios...';
        listEl.innerHTML = `<div class="episodes-loading"><div class="loading-spinner"></div><div>${loadMsg}</div></div>`;

        try {
            const episodes = await fetchKitsuEpisodes(kitsuId, epStart, epEnd);

            if (!episodes.length) {
                listEl.innerHTML = `<div class="episodes-loading">📭 Nenhum episódio encontrado nesta temporada.</div>`;
                return;
            }

            // Actualiza o total de episódios no cabeçalho do modal.
            // Para animes com sagas (ex: One Piece), usa o cache base sem filtro de range
            // para mostrar o total real da série, não apenas o da saga actual.
            if (currentAnime) {
                const baseCache = _episodesCache[String(kitsuId)];
                currentAnime.totalEpisodes = baseCache ? baseCache.length : episodes.length;
                updateModalMeta();
            }

            renderEpisodes(kitsuId, episodes);
        } catch (err) {
            console.error('Erro ao carregar episódios:', err);
            listEl.innerHTML = `<div class="episodes-loading">⚠️ Erro ao carregar episódios.<br>
                <small style="color:var(--text-muted)">${escapeHtml(err.message)}</small></div>`;
        }
    }

    function renderEpisodes(kitsuId, episodes) {
        const listEl   = document.getElementById('episodesList');
        const allRatings = getEpRatings();
        const seenEps    = getSeenEps();
        const userName = document.getElementById('epUsernameInput').value.trim();

        listEl.innerHTML = `<div class="episodes-list">${
            episodes.map(ep => {
                const epKey    = `${kitsuId}-${ep.numero}`;
                const epRatings = allRatings[epKey] || {};
                const vals     = Object.values(epRatings).filter(v => typeof v === 'number');
                const notaMedia = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;
                const totalNotas = vals.length;
                const notaUser   = userName ? (epRatings[userName] ?? null) : null;

                const titulo  = ep.titulo || `Episódio ${ep.numero}`;
                const rated   = notaUser !== null;
                const avgText = totalNotas > 0 ? `★ ${notaMedia.toFixed(1)} (${totalNotas})` : '—';
                const selVal  = rated ? Math.round(notaUser) : 0;
                const isSeen  = !!seenEps[epKey];

                const options = `<option value="0" ${!rated ? 'selected' : ''}>— Nota —</option>`
                    + Array.from({ length: 10 }, (_, i) => i + 1)
                          .map(n => `<option value="${n}" ${selVal === n ? 'selected' : ''}>${n}/10</option>`)
                          .join('');

                return `
                <div class="episode-row${isSeen ? ' seen-row' : ''}" id="eprow-${epKey}">
                    <div class="ep-seen-wrap">
                        <button class="ep-seen-btn${isSeen ? ' seen' : ''}"
                                onclick="toggleEpSeen('${epKey}', this)"
                                title="${isSeen ? 'Visto ✓' : 'Marcar como visto'}"
                                aria-label="${isSeen ? 'Marcar como não visto' : 'Marcar como visto'}"
                                aria-pressed="${isSeen}">${isSeen ? '✓' : '👁'}</button>
                    </div>
                    <span class="episode-num">Ep ${ep.numero}</span>
                    <span class="episode-title" title="${escapeHtml(titulo)}">${escapeHtml(titulo)}</span>
                    <span class="episode-avg" id="epavg-${epKey}">${escapeHtml(avgText)}</span>
                    <select class="episode-nota-select ${rated ? 'rated' : ''}"
                            id="sel-${epKey}"
                            aria-label="Nota para episódio ${ep.numero}"
                            onchange="this.classList.toggle('rated', this.value !== '0')">
                        ${options}
                    </select>
                    <button class="episode-save-btn ${rated ? 'saved' : ''}"
                            id="savebtn-${epKey}"
                            onclick="saveEpisodeNota('${epKey}', '${kitsuId}')"
                            aria-label="Guardar nota do episódio ${ep.numero}">
                        ${rated ? '✓ Guardado' : 'Guardar'}
                    </button>
                </div>`;
            }).join('')
        }</div>`;
    }

    /**
     * Guarda a nota de um episódio no localStorage.
     * epKey = "<kitsuId>-<numero>"
     */
    function saveEpisodeNota(epKey, kitsuId) {
        const sel      = document.getElementById('sel-' + epKey);
        const btn      = document.getElementById('savebtn-' + epKey);
        const nota     = parseInt(sel.value, 10);
        const userName = document.getElementById('epUsernameInput').value.trim() || 'Anônimo';

        if (!nota || nota < 1 || nota > 10) {
            sel.style.borderColor = 'var(--danger)';
            setTimeout(() => sel.style.borderColor = '', 1800);
            return;
        }

        // Salva no localStorage
        const allRatings = getEpRatings();
        if (!allRatings[epKey]) allRatings[epKey] = {};
        allRatings[epKey][userName] = nota;
        saveEpRatings(allRatings);

        // Recalcula média
        const vals      = Object.values(allRatings[epKey]).filter(v => typeof v === 'number');
        const notaMedia = vals.reduce((a, b) => a + b, 0) / vals.length;
        const total     = vals.length;

        // Atualiza UI
        const avgEl = document.getElementById('epavg-' + epKey);
        if (avgEl) avgEl.textContent = `★ ${notaMedia.toFixed(1)} (${total})`;

        btn.textContent = '✓ Guardado';
        btn.classList.add('saved');
        sel.classList.add('rated');

        const epNum = epKey.split('-').pop();
        showToast(`✅ Ep ${epNum} avaliado com ${nota}/10!`);
    }

    /* ════════════════════════════════════════════════════════════
       RESENHAS — LocalStorage
    ════════════════════════════════════════════════════════════ */

    function submitReview() {
        if (currentRating === 0) {
            shakeElement(document.getElementById('ratingInput'));
            document.getElementById('ratingHint').textContent = '⚠️ Selecione uma nota antes de enviar!';
            document.getElementById('ratingHint').style.color = 'var(--danger)';
            return;
        }

        const text = document.getElementById('reviewInput').value.trim();
        if (!text) {
            document.getElementById('reviewInput').focus();
            document.getElementById('reviewInput').style.borderColor = 'var(--danger)';
            setTimeout(() => document.getElementById('reviewInput').style.borderColor = '', 1800);
            return;
        }

        const userName = document.getElementById('usernameInput').value.trim() || 'Anônimo';

        const review = {
            id:              Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
            animeId:         String(currentAnime.id),
            animeTitle:      currentAnime.title,
            animeImage:      currentAnime.image,
            userName:        userName,
            rating:          parseInt(currentRating, 10),
            comment:         text,
            containsSpoiler: document.getElementById('spoilerCheck').checked,
            likes:           0,
            createdAt:       new Date().toISOString(),
        };

        const reviews = getReviews();
        reviews.unshift(review);   // mais recente primeiro
        saveReviews(reviews);

        closeModal();
        showToast('✅ Resenha enviada com sucesso!');
        renderReviewsFeed();
    }

    function renderReviewsFeed() {
        const feed    = document.getElementById('reviewsFeed');
        const reviews = getReviews();
        const likes   = getLikes();

        if (!reviews.length) {
            feed.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">📝</div>
                    <div>Nenhuma resenha ainda</div>
                    <div style="font-size:0.9rem;margin-top:0.4rem">Seja o primeiro a avaliar um anime!</div>
                </div>`;
            return;
        }

        feed.innerHTML = reviews.map(r => {
            const author  = r.userName || r.username || 'Anônimo';
            const text    = r.comment  || r.review   || '';
            const spoiler = r.containsSpoiler || r.hasSpoiler || false;
            const initial = author[0].toUpperCase();
            const stars   = Array.from({ length: 10 }, (_, i) =>
                `<span class="s${i < r.rating ? ' on' : ''}">★</span>`
            ).join('');
            const dateStr = r.createdAt
                ? new Date(r.createdAt).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' })
                : '';
            const imgSrc  = r.animeImage || 'https://placehold.co/56x80/1f1f26/71717a?text=?';
            const liked   = likes[r.id] ? 'liked' : '';
            const likeCnt = (r.likes || 0) + (likes[r.id] ? 1 : 0);

            const bodyHtml = spoiler
                ? `<div class="spoiler-box blurred" onclick="this.classList.toggle('blurred')" title="Clique para revelar">
                        <div class="spoiler-warning">⚠️ Spoiler — clique para revelar</div>
                        <div class="spoiler-text">${escapeHtml(text)}</div>
                   </div>`
                : `<div class="review-text">${escapeHtml(text)}</div>`;

            return `
            <div class="review-card">
                <div class="review-top">
                    <img class="review-anime-thumb" src="${imgSrc}" alt="${escapeHtml(r.animeTitle || '')}" loading="lazy">
                    <div class="review-info">
                        <div class="review-anime-title">${escapeHtml(r.animeTitle || '')}</div>
                        <div class="review-author-row">
                            <div class="review-avatar" aria-hidden="true">${initial}</div>
                            <span class="review-author-name">${escapeHtml(author)}</span>
                            ${dateStr ? `<span class="review-date">${dateStr}</span>` : ''}
                        </div>
                        <div class="review-stars">
                            ${stars}
                            <span class="review-score-badge">${r.rating}/10</span>
                        </div>
                    </div>
                </div>
                <div class="review-body">${bodyHtml}</div>
                <div class="review-actions">
                    <button class="btn btn-like ${liked}" onclick="likeReview('${r.id}', this)"
                            aria-label="Curtir resenha" aria-pressed="${!!likes[r.id]}">
                        ♥ <span class="like-count">${likeCnt}</span>
                    </button>
                </div>
            </div>`;
        }).join('');
    }

    /**
     * Curtir uma resenha — salvo no localStorage.
     * Cada utilizador (por dispositivo) pode curtir uma vez por resenha.
     */
    function likeReview(reviewId, btn) {
        const likes = getLikes();
        if (likes[reviewId]) return;  // já curtiu — sem descurtir

        likes[reviewId] = true;
        saveLikes(likes);

        // Atualiza a UI imediatamente (sem rerender tudo)
        btn.classList.add('liked');
        btn.setAttribute('aria-pressed', 'true');
        const countEl = btn.querySelector('.like-count');
        if (countEl) countEl.textContent = parseInt(countEl.textContent || '0', 10) + 1;
    }

    /**
     * Marcar / desmarcar episódio como visto.
     * Persiste no localStorage com a chave LS_SEEN.
     */
    function toggleEpSeen(epKey, btn) {
        const seen = getSeenEps();
        const isSeen = !seen[epKey];
        if (isSeen) { seen[epKey] = true; } else { delete seen[epKey]; }
        saveSeenEps(seen);

        btn.classList.toggle('seen', isSeen);
        btn.setAttribute('aria-label', isSeen ? 'Marcar como não visto' : 'Marcar como visto');
        btn.setAttribute('title',      isSeen ? 'Visto ✓' : 'Marcar como visto');
        btn.textContent = isSeen ? '✓' : '👁';

        const row = document.getElementById(`eprow-${epKey}`);
        if (row) row.classList.toggle('seen-row', isSeen);
    }

    /* ════════════════════════════════════════════════════════════
       UTILITÁRIOS
    ════════════════════════════════════════════════════════════ */

    function escapeHtml(str) {
        if (str == null) return '';
        const d = document.createElement('div');
        d.textContent = String(str);
        return d.innerHTML;
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3200);
    }

    function shakeElement(el) {
        el.style.animation = 'none';
        el.offsetHeight;
        el.style.animation = 'shake 0.4s ease';
    }

    /* Fechar modal com clique fora ou Escape */
    document.getElementById('animeModal').addEventListener('click', e => {
        if (e.target.id === 'animeModal') closeModal();
    });
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') closeModal();
    });
    </script>
</body>
