    /* ════════════════════════════════════════════════════════════
       KITSU API — TEMPORADAS (detecção dinâmica via media-relationships)
    ════════════════════════════════════════════════════════════ */

    /* ════════════════════════════════════════════════════════════
       KITSU — DETECÇÃO DINÂMICA DE TEMPORADAS
       Estratégia de 3 camadas para máxima robustez:
         1. Mapa manual (ANIME_SEASONS_MAP) — resposta instantânea
         2. Endpoint /anime/:id/relationships/sequels  (mais fiável)
         3. Fallback: endpoint media-relationships com include
    ════════════════════════════════════════════════════════════ */

    /**
     * Busca os sequels DIRECTOS de um anime via o endpoint
     * GET /anime/:id/relationships/sequels
     * Retorna array de IDs (strings).
     */
    async function kitsuGetSequels(animeId) {
        try {
            const res = await fetch(
                `${KITSU_BASE}/anime/${animeId}/relationships/sequels`,
                { headers: KITSU_HEADERS }
            );
            if (!res.ok) return [];
            const body = await res.json();
            return (body.data || []).map(d => String(d.id));
        } catch { return []; }
    }

    /**
     * Busca os prequels DIRECTOS de um anime via o endpoint
     * GET /anime/:id/relationships/prequels
     * Retorna array de IDs (strings).
     */
    async function kitsuGetPrequels(animeId) {
        try {
            const res = await fetch(
                `${KITSU_BASE}/anime/${animeId}/relationships/prequels`,
                { headers: KITSU_HEADERS }
            );
            if (!res.ok) return [];
            const body = await res.json();
            return (body.data || []).map(d => String(d.id));
        } catch { return []; }
    }

    /**
     * Fallback: usa media-relationships com include para obter
     * sequels/prequels quando os endpoints directos falham.
     * Retorna { sequels: [id,...], prequels: [id,...] }
     */
    async function kitsuGetRelationshipsFallback(animeId) {
        try {
            const res = await fetch(
                `${KITSU_BASE}/media-relationships` +
                `?filter[source_id]=${animeId}&filter[source_type]=Anime` +
                `&include=destination&page[limit]=20`,
                { headers: KITSU_HEADERS }
            );
            if (!res.ok) return { sequels: [], prequels: [] };
            const body   = await res.json();
            const result = { sequels: [], prequels: [] };
            for (const rel of (body.data || [])) {
                const role     = (rel.attributes?.role || '').toLowerCase();
                const destData = rel.relationships?.destination?.data;
                if (!destData) continue;
                const destId   = String(destData.id || '');
                const destType = (destData.type || '').toLowerCase();
                if (!destType.includes('anime')) continue;
                if (role === 'sequel')  result.sequels.push(destId);
                if (role === 'prequel') result.prequels.push(destId);
            }
            return result;
        } catch { return { sequels: [], prequels: [] }; }
    }

    /**
     * Busca sequels com fallback automático:
     * Tenta /relationships/sequels primeiro, depois media-relationships.
     */
    async function getSequels(animeId) {
        const direct = await kitsuGetSequels(animeId);
        if (direct.length > 0) return direct;
        const fb = await kitsuGetRelationshipsFallback(animeId);
        return fb.sequels;
    }

    /**
     * Busca prequels com fallback automático.
     */
    async function getPrequels(animeId) {
        const direct = await kitsuGetPrequels(animeId);
        if (direct.length > 0) return direct;
        const fb = await kitsuGetRelationshipsFallback(animeId);
        return fb.prequels;
    }

    /**
     * Navega para trás via prequels para encontrar a T1 (root).
     */
    async function findRootAnime(animeId) {
        let rootId  = String(animeId);
        const visited = new Set();
        for (let i = 0; i < 8; i++) {
            if (visited.has(rootId)) break;
            visited.add(rootId);
            const prequels = await getPrequels(rootId);
            if (!prequels.length) break;
            rootId = prequels[0];
        }
        return rootId;
    }

    /**
     * A partir do root, percorre sequels para montar a chain completa.
     * Retorna array de { kitsuId, subtype, title } — inclui TV E não-TV,
     * para que detectKitsuSeasons possa gerar labels correctos para cada tipo.
     */
    async function buildSeasonChain(rootId) {
        // Busca info do root (subtype + título canónico)
        const rootInfo = await kitsuGetInfo(rootId);
        const chain    = [{ kitsuId: rootId, subtype: rootInfo.subtype, title: rootInfo.title }];
        const seen     = new Set([rootId]);
        let   cursor   = rootId;

        for (let i = 0; i < 14; i++) {
            const sequels = await getSequels(cursor);
            if (!sequels.length) break;

            // Busca info de todos os sequels em paralelo
            const infos = await Promise.all(sequels.map(s => kitsuGetInfo(s)));

            let advanced = false;
            for (let j = 0; j < sequels.length; j++) {
                const sid  = sequels[j];
                if (seen.has(sid)) continue;
                seen.add(sid);

                chain.push({ kitsuId: sid, subtype: infos[j].subtype, title: infos[j].title });

                // Avança o cursor apenas em entradas TV/web (ignora OVAs/Filmes como "fim da chain")
                const NON_TV_CURSOR = new Set(['ova', 'ona', 'movie', 'special', 'music']);
                if (!NON_TV_CURSOR.has(infos[j].subtype)) {
                    cursor  = sid;
                    advanced = true;
                    break;
                }
            }
            if (!advanced) break;
        }

        return chain;
    }

    /**
     * Busca subtype + título canónico de um anime na Kitsu com cache.
     * Retorna { subtype: 'tv'|'ova'|'movie'|'special'|..., title: string }
     */
    async function kitsuGetInfo(animeId) {
        if (_subtypeCache[animeId]) return _subtypeCache[animeId];
        try {
            const res = await fetch(
                `${KITSU_BASE}/anime/${animeId}?fields[anime]=subtype,canonicalTitle`,
                { headers: KITSU_HEADERS }
            );
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const json  = await res.json();
            const attrs = json.data?.attributes || {};
            const info  = {
                subtype: (attrs.subtype || 'TV').toLowerCase(),
                title:   attrs.canonicalTitle || '',
            };
            _subtypeCache[animeId] = info;
            return info;
        } catch {
            const fallback = { subtype: 'tv', title: '' };
            _subtypeCache[animeId] = fallback;
            return fallback;
        }
    }

    // Mantém kitsuGetSubtype como alias simples (compatibilidade)
    async function kitsuGetSubtype(animeId) {
        return (await kitsuGetInfo(animeId)).subtype;
    }

    /**
     * Detecção dinâmica de temporadas via Kitsu.
     * Retorna [{label, kitsuId}] ou [] para série única (sem dropdown).
     *
     * Labels gerados por subtype:
     *   TV/web  → "1ª Temporada", "2ª Temporada", ... (contador próprio)
     *   movie   → "Filme" (ou "Filme 2", "Filme 3" se houver múltiplos)
     *   ova     → "OVA" / "OVA 2" ...
     *   special → "Especial" / "Especial 2" ...
     *   ona     → "ONA" / "ONA 2" ...
     *
     * O contador de "Xª Temporada" incrementa APENAS para TV/web.
     */
    async function detectKitsuSeasons(animeId) {
        const id = String(animeId);
        if (_seasonsCache[id] !== undefined) return _seasonsCache[id];
        _seasonsCache[id] = null;  // marca em progresso

        try {
            const rootId    = await findRootAnime(id);
            const chainInfo = await buildSeasonChain(rootId);  // [{kitsuId, subtype, title}]

            const ordinals  = ['1ª','2ª','3ª','4ª','5ª','6ª','7ª','8ª','9ª','10ª','11ª','12ª'];

            // Contadores separados por tipo
            const counters  = { tv: 0, web: 0, movie: 0, ova: 0, special: 0, ona: 0 };

            const seasons = chainInfo.map(entry => {
                const sub = entry.subtype;  // já em lowercase

                let label;
                if (sub === 'tv' || sub === 'web') {
                    counters.tv++;
                    const ord = ordinals[counters.tv - 1] || (counters.tv + 'ª');
                    label = `${ord} Temporada`;
                } else if (sub === 'movie') {
                    counters.movie++;
                    label = counters.movie > 1 ? `Filme ${counters.movie}` : 'Filme';
                } else if (sub === 'ova') {
                    counters.ova++;
                    label = counters.ova > 1 ? `OVA ${counters.ova}` : 'OVA';
                } else if (sub === 'special') {
                    counters.special++;
                    label = counters.special > 1 ? `Especial ${counters.special}` : 'Especial';
                } else if (sub === 'ona') {
                    counters.ona++;
                    label = counters.ona > 1 ? `ONA ${counters.ona}` : 'ONA';
                } else {
                    counters.tv++;  // fallback: assume TV
                    const ord = ordinals[counters.tv - 1] || (counters.tv + 'ª');
                    label = `${ord} Temporada`;
                }

                return { label, kitsuId: entry.kitsuId, subtype: sub };
            });

            // Série única sem dropdown
            const result = seasons.length <= 1 ? [] : seasons;

            // Cache para todos os IDs da chain
            for (const entry of chainInfo) {
                _seasonsCache[entry.kitsuId] = result;
            }

            console.log(`[Temporadas] Anime ${id} → ${result.length || 1} entrada(s):`,
                result.map(s => `${s.label} [${s.subtype}] (${s.kitsuId})`));

            return result;
        } catch (err) {
            console.warn('[Temporadas] Falhou para', animeId, err);
            _seasonsCache[id] = [];
            return [];
        }
    }

    /**
     * Retorna as temporadas de um anime.
     * Prioridade: mapa manual → detecção dinâmica Kitsu.
     */
    async function getSeasonsForAnime(animeId) {
        const entry = ANIME_SEASONS_MAP[String(animeId)];
        if (entry) {
            console.log(`[Temporadas] Anime ${animeId} → mapa manual (${entry.seasons.length} temporada(s))`);
            return entry.seasons;
        }
        return await detectKitsuSeasons(animeId);
    }

    /* ════════════════════════════════════════════════════════════
       KITSU API — EPISÓDIOS
    ════════════════════════════════════════════════════════════ */

    /**
     * Busca TODOS os episódios de um kitsuId directamente na Kitsu API.
     * Paginação automática sem limite de páginas — percorre todos os
     * links "next" até esgotar, garantindo séries longas como One Piece.
     *
     * Kitsu aceita page[limit] até 20 por request na rota /episodes.
     * Usamos o máximo permitido (20) e seguimos os links automáticos.
     *
     * Retorna [{numero, titulo}] ordenado por número.
     * Usa cache de sessão — chamadas repetidas para o mesmo ID são grátis.
     */
    async function fetchKitsuEpisodes(kitsuId, epStart = null, epEnd = null) {
        // Chave de cache inclui range para sagas
        const cacheKey = epStart != null ? `${kitsuId}:${epStart}-${epEnd}` : kitsuId;
        if (_episodesCache[cacheKey]) return _episodesCache[cacheKey];

        // Se os episódios base já foram buscados, apenas filtra
        const baseKey = String(kitsuId);
        if (!_episodesCache[baseKey]) {
            // Busca completa: percorre TODAS as páginas sem limite
            const episodes = [];
            let   url      = `${KITSU_BASE}/anime/${kitsuId}/episodes?page[limit]=20&sort=number`;
            let   attempts = 0;
            const MAX_PAGES = 200;  // tecto de segurança: 200 × 20 = 4000 eps

            while (url && attempts < MAX_PAGES) {
                attempts++;
                try {
                    const res = await fetch(url, { headers: KITSU_HEADERS });
                    if (!res.ok) break;
                    const data  = await res.json();
                    const items = data.data || [];
                    if (!items.length) break;

                    for (const ep of items) {
                        const a      = ep.attributes || {};
                        const titles = a.titles || {};
                        const titulo = titles.pt_br
                                    || titles.pt
                                    || a.canonicalTitle
                                    || titles.en
                                    || titles.en_us
                                    || '';
                        const num = a.number ?? (episodes.length + 1);
                        episodes.push({ numero: num, titulo });
                    }

                    url = data.links?.next || null;
                } catch (err) {
                    console.warn(`[Episódios] Falha na página ${attempts} de ${kitsuId}:`, err);
                    break;
                }
            }

            // Ordena por número (garante ordem mesmo se a API não respeitar)
            episodes.sort((a, b) => a.numero - b.numero);

            _episodesCache[baseKey] = episodes;
            console.log(`[Episódios] ${kitsuId}: ${episodes.length} eps carregados (${attempts} páginas)`);
        }

        // Aplica filtro de range para sagas (ex: One Piece)
        let result = _episodesCache[baseKey];
        if (epStart != null) {
            result = result.filter(ep => ep.numero >= epStart && ep.numero <= epEnd);
        }

        _episodesCache[cacheKey] = result;
        return result;
    }

    /* ════════════════════════════════════════════════════════════
       MODAL
    ════════════════════════════════════════════════════════════ */

    /** Actualiza o bloco de metadados do modal com os dados actuais. */
    function updateModalMeta() {
        // Badge de episódios totais (actualizado dinamicamente após carregar episódios)
        let episodesTag = '';
        if (currentAnime.totalEpisodes != null) {
            const n = currentAnime.totalEpisodes;
            episodesTag = `<span>📺 ${n} ${n === 1 ? 'episódio' : 'episódios'}</span>`;
        } else {
            episodesTag = `<span id="metaEpsLoading" style="color:var(--text-muted);font-size:0.8rem">⏳ a contar episódios...</span>`;
        }

        document.getElementById('modalMeta').innerHTML = [
            currentAnime.type  && `<span>${currentAnime.type}</span>`,
            currentAnime.year  && `<span>${currentAnime.year}</span>`,
            currentAnime.score && `<span>★ ${currentAnime.score}</span>`,
            episodesTag,
        ].filter(Boolean).join('');
    }

    /* ════════════════════════════════════════════════════════════
       SURPREENDE-ME! — anime aleatório (Passo 4)
       Sorteia um offset aleatório entre os animes mais bem
       avaliados e abre o modal de detalhes desse anime.
    ════════════════════════════════════════════════════════════ */
    const SURPRISE_MAX_OFFSET = 3000;   // mantém o sorteio no grupo dos mais bem avaliados
    let _surpriseLoading = false;

    async function surpriseMe() {
        if (_surpriseLoading) return;
        const btn = document.getElementById('surpriseBtn');
        _surpriseLoading = true;
        btn.classList.add('loading');
        btn.disabled = true;

        try {
            const offset = Math.floor(Math.random() * SURPRISE_MAX_OFFSET);
            const res = await fetch(
                `${KITSU_BASE}/anime?page[limit]=20&page[offset]=${offset}&sort=-averageRating`,
                { headers: KITSU_HEADERS }
            );
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();

            // Apenas animes com capa e avaliação (evita entradas incompletas)
            const pool = (data.data || []).filter(it =>
                it.attributes?.posterImage?.small && it.attributes?.averageRating
            );
            if (pool.length === 0) throw new Error('Sem resultados');

            const pick = pool[Math.floor(Math.random() * pool.length)];
            await openModal(pick.id);   // abre o modal assim que o anime é sorteado
        } catch (err) {
            console.error('Erro no Surpreende-me:', err);
            showToast('Não foi possível sortear um anime. Tente novamente.');
        } finally {
            btn.classList.remove('loading');
            btn.disabled = false;
            _surpriseLoading = false;
        }
    }

    async function openModal(animeId) {
        try {
            // Abre o modal imediatamente com os dados do anime (sem esperar temporadas)
            const res = await fetch(`${KITSU_BASE}/anime/${animeId}`, { headers: KITSU_HEADERS });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const json = await res.json();
            const a    = json.data.attributes;

            currentKitsuSeasons = [];
            currentAnime = {
                id:       String(animeId),
                title:    a.canonicalTitle || 'Sem título',
                image:    a.posterImage?.small || '',
                synopsis: a.synopsis || 'Sem sinopse disponível.',
                score:    kitsuScore(a.averageRating),
                type:     a.subtype,
                episodes: a.episodeCount,
                year:     a.startDate ? a.startDate.slice(0, 4) : null,
                totalEpisodes: null,  // preenchido dinamicamente após carregar episódios
                youtubeVideoId: a.youtubeVideoId || null,  // trailer oficial (Passo 4)
            };

            document.getElementById('modalImage').src = currentAnime.image;
            document.getElementById('modalImage').alt = currentAnime.title;
            document.getElementById('modalTitle').textContent    = currentAnime.title;
            document.getElementById('modalSynopsis').textContent = currentAnime.synopsis;

            // Selos das plataformas onde o anime está disponível
            document.getElementById('modalPlatformBadges').innerHTML = platformBadgesHtml(currentAnime.id);

            // Só mostra o botão "Assistir Trailer" se o anime tiver trailer do YouTube
            document.getElementById('modalTrailerBtn').style.display =
                currentAnime.youtubeVideoId ? '' : 'none';

            updateModalMeta();
            resetForm();
            syncItemButtons(currentAnime.id);   // estado inicial dos botões Favorito/Watchlist
            document.getElementById('animeModal').classList.add('active');
            // Ao clicar numa recomendação, garante que o novo anime aparece no topo
            document.querySelector('#animeModal .modal').scrollTop = 0;
            document.getElementById('usernameInput').focus();

            // Recomendações "Se gostaste disto..." (assíncrono, não bloqueia o modal)
            loadRecommendations(animeId);

            // Busca temporadas de forma assíncrona — actualiza o modal quando chegar
            getSeasonsForAnime(animeId).then(seasons => {
                // Verifica se o modal ainda é o mesmo anime (utilizador pode ter fechado)
                if (!currentAnime || currentAnime.id !== String(animeId)) return;

                currentKitsuSeasons = seasons;

                // Actualiza o meta (o total de episódios será atribuído quando os eps carregarem)
                updateModalMeta();

                // Se a tab de episódios já estiver aberta, reconstrói o seletor
                const panelEp = document.getElementById('panelEpisodes');
                if (panelEp && panelEp.style.display !== 'none') {
                    document.getElementById('seasonsBar').innerHTML = '';
                    initSeasonSelect();
                }
            });

        } catch (err) {
            console.error('Erro ao abrir modal:', err);
            alert('Não foi possível carregar os detalhes deste anime.');
        }
    }

    /* ════════════════════════════════════════════════════════════
       TRAILER DO YOUTUBE (Passo 4)
       Player 16:9 embutido diretamente via youtube-nocookie.com.

    function openTrailer() {

    /* ════════════════════════════════════════════════════════════
       CALENDÁRIO SEMANAL (SIMULCAST) — programação em tempo real
       Fonte principal : AniList GraphQL — agenda real dos animes em
                         exibição (status RELEASING) via nextAiringEpisode.
       Fallback        : catálogo do Kitsu (filter[status]=current).
       Os animes são agrupados automaticamente por dia da semana
       (Segunda → Domingo), com capa, título, horário, episódio e selos.
    ════════════════════════════════════════════════════════════ */
    const WEEK_DAYS    = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
    const DAY_ORDER    = [1, 2, 3, 4, 5, 6, 0];   // começa na Segunda-feira
    const ANILIST_URL  = 'https://graphql.anilist.co';
    const CALENDAR_PAGES = 3;                      // AniList: 3 × 50 = até 150 animes em exibição
    let   _calendarLoaded    = false;
    let   _calendarItems     = {};                 // key → item (para o clique nos cards)
    let   _kitsuIndex        = null;               // Map(título normalizado → id Kitsu)
    let   _kitsuIndexPromise = null;

    function openCalendar() {
        document.getElementById('calendarModal').classList.add('active');
        if (!_calendarLoaded) loadCalendar();
    }

    function closeCalendar() {
        document.getElementById('calendarModal').classList.remove('active');
    }

    /** Distribuição determinística por id — mantém o mesmo anime sempre no mesmo dia */
    function dayFromId(id) {
        const s = String(id);
        let h = 0;
        for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
        return h % 7;
    }

    /** Estimativa do episódio mais recente (cadência semanal a partir de startDate) */
    function estimateLatestEpisode(a) {
        const total = a.episodeCount;
        if (!a.startDate) return total || null;
        const start = new Date(`${a.startDate}T00:00:00Z`);
        if (isNaN(start.getTime())) return total || null;
        const weeks = Math.floor((Date.now() - start.getTime()) / (7 * 24 * 3600 * 1000));
        let n = weeks + 1;
        if (n < 1) n = 1;
        if (total && n > total) n = total;
        return n;
    }

    /** Normaliza um título para comparação entre AniList e Kitsu */
    function normalizeTitle(str) {
        return String(str || '')
            .toLowerCase()
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .replace(/[^a-z0-9]+/g, ' ')
            .trim();
    }

    /** Hora local (HH:MM) a partir de um timestamp Unix em segundos */
    function formatAiringTime(unixSeconds) {
        const d = new Date(unixSeconds * 1000);
        if (isNaN(d.getTime())) return '';
        return d.toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' });
    }

    /**
     * Índice título → id do Kitsu (animes em exibição). Construído uma só vez
     * e usado para mapear os títulos da AniList para o catálogo do Kitsu, o que
     * permite atribuir automaticamente os selos de plataforma aos cards.
     */
    function buildKitsuIndex() {
        if (_kitsuIndex) return Promise.resolve(_kitsuIndex);
        if (_kitsuIndexPromise) return _kitsuIndexPromise;
        _kitsuIndexPromise = (async () => {
            const idx  = new Map();
            const reqs = Array.from({ length: 5 }, (_, i) =>
                fetch(`${KITSU_BASE}/anime?filter[status]=current&sort=-userCount&page[limit]=20&page[offset]=${i * 20}`,
                      { headers: KITSU_HEADERS })
                    .then(r => r.ok ? r.json() : { data: [] })
                    .catch(() => ({ data: [] }))
            );
            const results = await Promise.all(reqs);
            results.forEach(r => (r.data || []).forEach(it => {
                const a = it.attributes || {};
                if (a.nsfw === true) return;   // ignora conteúdo +18 / NSFW
                const t = a.titles || {};
                [a.canonicalTitle, t.en, t.en_jp, t.ja_jp].filter(Boolean).forEach(name => {
                    const key = normalizeTitle(name);
                    if (key && !idx.has(key)) idx.set(key, String(it.id));
                });
            }));
            _kitsuIndex = idx;
            return idx;
        })();
        return _kitsuIndexPromise;
    }

    /** Procura o id do Kitsu a partir de uma lista de títulos candidatos */
    async function resolveKitsuId(titles) {
        const list = (Array.isArray(titles) ? titles : [titles]).filter(Boolean);
        if (!list.length) return null;
        try {
            const idx = await buildKitsuIndex();
            for (const t of list) {
                const hit = idx.get(normalizeTitle(t));
                if (hit) return hit;
            }
        } catch (_) { /* segue para a busca directa */ }
        for (const t of list) {
            try {
                const res = await fetch(`${KITSU_BASE}/anime?filter[text]=${encodeURIComponent(t)}&page[limit]=1`,
                                        { headers: KITSU_HEADERS });
                if (!res.ok) continue;
                const json  = await res.json();
                const first = (json.data || [])[0];
                if (first) return String(first.id);
            } catch (_) { /* tenta o próximo título */ }
        }
        return null;
    }

    /** Fonte principal — AniList GraphQL: animes em exibição ordenados por popularidade */
    async function fetchCalendarFromAniList() {
        const query = `
            query ($page: Int) {
                Page(page: $page, perPage: 50) {
                    media(type: ANIME, status: RELEASING, sort: POPULARITY_DESC, isAdult: false) {
                        id
                        idMal
                        isAdult
                        title { romaji english native }
                        coverImage { medium }
                        averageScore
                        episodes
                        nextAiringEpisode { episode airingAt }
                    }
                }
            }`;
        const reqs = Array.from({ length: CALENDAR_PAGES }, (_, i) =>
            fetch(ANILIST_URL, {
                method:  'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body:    JSON.stringify({ query, variables: { page: i + 1 } }),
            })
            .then(r => r.ok ? r.json() : null)
            .catch(() => null)
        );
        const results = await Promise.all(reqs);
        const seen    = new Set();
        const out     = [];
        results.forEach(r => {
            const media = (r && r.data && r.data.Page && r.data.Page.media) || [];
            media.forEach(m => {
                if (!m || seen.has(m.id)) return;
                if (m.isAdult === true) return;   // ignora conteúdo +18 / NSFW
                seen.add(m.id);
                const t      = m.title || {};
                const titles = [t.english, t.romaji, t.native].filter(Boolean);
                const cover  = m.coverImage && m.coverImage.medium;
                if (!titles.length || !cover) return;
                const next    = m.nextAiringEpisode;
                const day     = next ? new Date(next.airingAt * 1000).getDay() : dayFromId(m.id);
                const episode = next
                    ? (next.episode > 1 ? next.episode - 1 : null)
                    : (m.episodes || null);
                out.push({
                    key:     `al-${m.id}`,
                    titles,
                    title:   t.english || t.romaji || t.native,
                    cover,
                    score:   m.averageScore ? (m.averageScore / 10).toFixed(1) : null,
                    day,
                    time:    next ? formatAiringTime(next.airingAt) : '',
                    episode,
                    kitsuId: null,
                });
            });
        });
        return out;
    }

    /** Fallback — catálogo de animes em exibição do Kitsu */
    async function fetchCalendarFromKitsu() {
        const reqs = Array.from({ length: 5 }, (_, i) =>
            fetch(`${KITSU_BASE}/anime?filter[status]=current&sort=-userCount&page[limit]=20&page[offset]=${i * 20}`,
                  { headers: KITSU_HEADERS })
                .then(r => r.ok ? r.json() : { data: [] })
                .catch(() => ({ data: [] }))
        );
        const results = await Promise.all(reqs);
        const seen    = new Set();
        const out     = [];
        results.forEach(r => (r.data || []).forEach(it => {
            if (seen.has(it.id)) return;
            const a = it.attributes || {};
            if (a.nsfw === true) return;   // ignora conteúdo +18 / NSFW
            seen.add(it.id);
            if (!a.posterImage || !a.posterImage.small) return;
            let day, time = '';
            if (a.nextRelease) {
                const d = new Date(a.nextRelease);
                if (!isNaN(d.getTime())) {
                    day  = d.getDay();
                    time = formatAiringTime(d.getTime() / 1000);
                }
            }
            if (day === undefined) day = dayFromId(it.id);
            const t      = a.titles || {};
            const titles = [a.canonicalTitle, t.en, t.en_jp, t.ja_jp].filter(Boolean);
            out.push({
                key:     `kt-${it.id}`,
                titles,
                title:   a.canonicalTitle || titles[0] || 'Sem título',
                cover:   a.posterImage.small,
                score:   kitsuScore(a.averageRating),
                day,
                time,
                episode: estimateLatestEpisode(a),
                kitsuId: String(it.id),
            });
        }));
        return out;
    }

    function setCalendarLoading() {
        document.getElementById('calendarGrid').innerHTML =
            `<div class="calendar-loading"><div class="loading-spinner"></div><div>A carregar a programação da semana...</div></div>`;
    }

    function setCalendarError(msg) {
        document.getElementById('calendarGrid').innerHTML =
            `<div class="calendar-error"><div>⚠️ ${msg}</div></div>`;
    }

    async function loadCalendar() {
        setCalendarLoading();
        try {
            // Índice Kitsu em paralelo — alimenta os selos de plataforma
            const indexPromise = buildKitsuIndex().catch(() => null);

            // 1) Fonte principal: AniList · 2) Fallback: Kitsu
            let items = await fetchCalendarFromAniList();
            if (!items.length) items = await fetchCalendarFromKitsu();
            if (!items.length) { setCalendarError('Não foi possível carregar a programação semanal.'); return; }

            // Mapeia (quando possível) cada anime para o id do Kitsu
            const idx = await indexPromise;
            if (idx) {
                items.forEach(it => {
                    if (it.kitsuId) return;
                    for (const t of it.titles) {
                        const hit = idx.get(normalizeTitle(t));
                        if (hit) { it.kitsuId = hit; break; }
                    }
                });
            }

            _calendarLoaded = true;
            renderCalendar(items);
        } catch (err) {
            console.error('Erro ao carregar o calendário:', err);
            setCalendarError('Não foi possível carregar a programação semanal.');
        }
    }

    /** Desenha o calendário: todos os animes agrupados por dia da semana */
    function renderCalendar(items) {
        const buckets = [[], [], [], [], [], [], []];
        _calendarItems = {};
        items.forEach(it => {
            const day = (it.day >= 0 && it.day <= 6) ? it.day : dayFromId(it.key);
            buckets[day].push(it);
        });

        const today = new Date().getDay();
        document.getElementById('calendarGrid').innerHTML = DAY_ORDER.map(day => {
            const list = buckets[day];
            return `
            <div class="calendar-day${day === today ? ' today' : ''}">
                <div class="calendar-day-header">
                    <span class="calendar-day-name">${WEEK_DAYS[day]}</span>
                    <span class="calendar-day-count">${list.length}</span>
                </div>
                <div class="calendar-day-list">
                    ${list.length ? list.map(renderCalendarCard).join('') : '<div class="calendar-empty">Sem lançamentos</div>'}
                </div>
            </div>`;
        }).join('');
    }

    function renderCalendarCard(item) {
        _calendarItems[item.key] = item;
        const title  = escapeHtml(item.title || 'Sem título');
        const cover  = item.cover || '';
        const time   = item.time ? `<span class="calendar-time">🕒 ${escapeHtml(item.time)}</span>` : '';
        const score  = item.score ? `<span class="calendar-score">★ ${item.score}</span>` : '';
        const ep     = item.episode ? `<span class="calendar-ep">Ep. ${item.episode}</span>` : '';
        const badges = item.kitsuId ? platformBadgesHtml(item.kitsuId) : '';
        return `
        <div class="calendar-card" role="button" tabindex="0" data-key="${item.key}"
             onclick="openCalendarCard('${item.key}')"
             onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openCalendarCard('${item.key}');}">
            <img class="calendar-card-img" src="${cover}" alt="" loading="lazy">
            <div class="calendar-card-info">
                <div class="calendar-card-title">${title}</div>
                <div class="calendar-card-meta">${time}${score}${ep}</div>
                ${badges ? `<div class="calendar-badges">${badges}</div>` : ''}
            </div>
        </div>`;
    }

    /** Clique num card: abre o modal pelo id do Kitsu ou resolve-o pelo título */
    async function openCalendarCard(key) {
        const item = _calendarItems[key];
        if (!item) return;
        if (item.kitsuId) { openModal(item.kitsuId); return; }

        const card = document.querySelector(`.calendar-card[data-key="${key}"]`);
        if (card) card.classList.add('loading');
        const id = await resolveKitsuId(item.titles);
        if (card) card.classList.remove('loading');

        if (!id) { showToast('Não foi possível encontrar este anime no catálogo.'); return; }

        item.kitsuId = id;
        const badgesHtml = platformBadgesHtml(id);
        if (card && badgesHtml) {
            const badgesEl = card.querySelector('.calendar-badges');
            if (badgesEl) badgesEl.innerHTML = badgesHtml;
            else card.querySelector('.calendar-card-info')
                     ?.insertAdjacentHTML('beforeend', `<div class="calendar-badges">${badgesHtml}</div>`);
        }
        openModal(id);
    }

    /* ════════════════════════════════════════════════════════════
       RECOMENDAÇÕES — "Se gostaste disto, vais adorar..."
    ════════════════════════════════════════════════════════════ */
    let _recsRequestId = 0;   // evita respostas fora de ordem ao trocar de anime

    /**
     * Carrega 4-6 animes semelhantes com base nas categorias/géneros do anime actual.
     * 1) Obtém as categorias via relação /anime/{id}/categories
     * 2) Filtra explicitamente por essa categoria e ordena por avaliação
     * 3) Exclui o próprio anime e afina pela sobreposição de categorias
     */
    async function loadRecommendations(animeId) {
        const section = document.getElementById('recommendationsSection');
        const grid    = document.getElementById('recsGrid');
        if (!section || !grid) return;

        const reqId = ++_recsRequestId;

        section.style.display = '';
        grid.innerHTML = `<div class="recs-loading">A procurar animes semelhantes...</div>`;

        try {
            // 1) Categorias/géneros do anime actual
            const catRes = await fetch(
                `${KITSU_BASE}/anime/${animeId}/categories?page[limit]=10`,
                { headers: KITSU_HEADERS }
            );
            if (!catRes.ok) throw new Error(`HTTP ${catRes.status}`);
            const catJson = await catRes.json();

            const myCats = catJson.data || [];
            if (!myCats.length) throw new Error('anime sem categorias');

            const myCatIds = new Set(myCats.map(c => String(c.id)));
            // Kitsu aplica AND em filter[categories], por isso usamos a categoria
            // principal (conjunto alargado) e afinamos por semelhança a seguir.
            const category = myCats[0].attributes?.slug || myCats[0].attributes?.title;
            if (!category) throw new Error('categoria inválida');

            // 2) Busca filtrada explicitamente pela categoria, ordenada por avaliação.
            //    include=categories traz as categorias de cada candidato (p/ medir semelhança).
            const recRes = await fetch(
                `${KITSU_BASE}/anime?filter[categories]=${encodeURIComponent(category)}` +
                `&sort=-averageRating&page[limit]=20&include=categories` +
                `&fields[anime]=canonicalTitle,posterImage,averageRating,subtype,startDate,categories`,
                { headers: KITSU_HEADERS }
            );
            if (!recRes.ok) throw new Error(`HTTP ${recRes.status}`);
            const recJson = await recRes.json();

            // 3) Exclui o próprio anime e reordena pelo nº de categorias em comum
            //    (desempate pela nota média, já pedida ao Kitsu em sort=-averageRating).
            const list = (recJson.data || [])
                .filter(item => String(item.id) !== String(animeId))
                .map(item => ({
                    item,
                    overlap: (item.relationships?.categories?.data || [])
                        .filter(c => myCatIds.has(String(c.id))).length,
                    rating:  parseFloat(item.attributes?.averageRating) || 0,
                }))
                .sort((a, b) => (b.overlap - a.overlap) || (b.rating - a.rating))
                .slice(0, 6)
                .map(x => x.item);

            // Chegou tarde? (utilizador já abriu outro anime)
            if (reqId !== _recsRequestId) return;

            if (!list.length) { section.style.display = 'none'; return; }

            renderRecommendations(list);
        } catch (err) {
            console.warn('Recomendações indisponíveis:', err);
            if (reqId !== _recsRequestId) return;
            section.style.display = 'none';
        }
    }

    function renderRecommendations(list) {
        const grid = document.getElementById('recsGrid');
        grid.innerHTML = list.map(item => {
            const a     = item.attributes;
            const title = escapeHtml(a.canonicalTitle || 'Sem título');
            const cover = a.posterImage?.small || 'https://placehold.co/160x240/1f1f26/71717a?text=Sem+Capa';
            const score = kitsuScore(a.averageRating);
            const year  = a.startDate ? a.startDate.slice(0, 4) : '';
            const meta  = [a.subtype, year].filter(Boolean).join(' • ');
            return `
            <div class="rec-card" role="button" tabindex="0"
                 aria-label="Ver detalhes de ${title}"
                 onclick="openModal('${item.id}')"
                 onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openModal('${item.id}');}">
                <div class="rec-card-image-container">
                    <img class="rec-card-image" src="${cover}" alt="${title}" loading="lazy">
                    ${score ? `<div class="rec-card-score">★ ${score}</div>` : ''}
                </div>
                <div class="rec-card-title">${title}</div>
                ${meta ? `<div class="rec-card-meta">${escapeHtml(meta)}</div>` : ''}
            </div>`;
        }).join('');
    }

    /* ════════════════════════════════════════════════════════════
       TABS DO MODAL
    ════════════════════════════════════════════════════════════ */
    function switchTab(tab) {
        const isEp = tab === 'episodes';
        document.getElementById('panelReview').style.display   = isEp ? 'none' : '';
        document.getElementById('panelEpisodes').style.display = isEp ? '' : 'none';
        document.getElementById('tabReview').classList.toggle('active',  !isEp);
        document.getElementById('tabEpisodes').classList.toggle('active', isEp);
        // Estado das tabs exposto a tecnologias de apoio (role="tab")
        document.getElementById('tabReview').setAttribute('aria-selected',   isEp ? 'false' : 'true');
        document.getElementById('tabEpisodes').setAttribute('aria-selected', isEp ? 'true'  : 'false');

        if (isEp && currentAnime && !document.getElementById('season-select')) {
            initSeasonSelect();
        }
    }

    /* ════════════════════════════════════════════════════════════
       SELETOR DE TEMPORADAS
    ════════════════════════════════════════════════════════════ */

    function initSeasonSelect() {
        const bar = document.getElementById('seasonsBar');
        bar.innerHTML = '';

        if (currentKitsuSeasons.length === 0) {
            // Série única — carrega o anime directamente sem dropdown
            renderEpisodesForSeason({ kitsuId: currentAnime.id });

            // Se as temporadas ainda não chegaram (cache null), aguarda
            if (_seasonsCache[currentAnime.id] === null || _seasonsCache[currentAnime.id] === undefined) {
                bar.innerHTML = `<div style="font-size:0.82rem;color:var(--text-muted);padding:0.4rem 0">
                    ⏳ A detetar temporadas...</div>`;
                getSeasonsForAnime(currentAnime.id).then(seasons => {
                    if (!currentAnime) return;
                    if (seasons.length > 1) {
                        currentKitsuSeasons = seasons;
                        bar.innerHTML = '';
                        buildSeasonDropdown(bar, seasons, 0, season => {
                            renderEpisodesForSeason(season);
                        });
                        updateModalMeta();
                    } else {
                        bar.innerHTML = '';
                    }
                });
            }
            return;
        }

        // Multi-temporada / sagas: monta dropdown
        // Selecciona a temporada cujo kitsuId corresponde ao anime clicado (ou a 1ª)
        const activeKitsuId = String(currentAnime.id);
        const defaultIdx    = currentKitsuSeasons.findIndex(s => s.kitsuId === activeKitsuId);
        const defaultSeason = currentKitsuSeasons[defaultIdx >= 0 ? defaultIdx : 0];

        buildSeasonDropdown(bar, currentKitsuSeasons, defaultIdx >= 0 ? defaultIdx : 0, season => {
            renderEpisodesForSeason(season);
        });
        renderEpisodesForSeason(defaultSeason);
    }

    /**
     * Retorna o emoji correcto para um subtype.
     */
    function subtypeIcon(subtype) {
        const s = (subtype || 'tv').toLowerCase();
        if (s === 'movie')   return '🎬';
        if (s === 'ova')     return '📼';
        if (s === 'special') return '⭐';
        if (s === 'ona')     return '🌐';
        return '📺';  // TV / web / default
    }

    /**
     * Constrói o seletor nativo de temporadas (<select id="season-select">).
     * activeIdx: índice numérico da opção pré-selecionada (0-based).
     * onSelect(season): callback recebe o objecto season completo {label, kitsuId, epStart?, epEnd?, subtype?}
     */
    function buildSeasonDropdown(container, seasons, activeIdx, onSelect) {
        const idx0 = typeof activeIdx === 'number' ? activeIdx : 0;

        const select = document.createElement('select');
        select.id = 'season-select';
        select.setAttribute('aria-label', 'Selecionar temporada');

        seasons.forEach((s, i) => {
            const opt = document.createElement('option');
            opt.value = String(i);
            opt.textContent = `${subtypeIcon(s.subtype)} ${s.label || 'Temporada'}`;
            if (i === idx0) opt.selected = true;
            select.appendChild(opt);
        });

        select.addEventListener('change', () => {
            const s = seasons[Number(select.value)];
            if (s) onSelect(s);  // passa o objecto season completo
        });

        container.appendChild(select);
    }

    /* ════════════════════════════════════════════════════════════
       EPISÓDIOS — BUSCA E RENDERIZAÇÃO
    ════════════════════════════════════════════════════════════ */

    /**
     * Carrega e renderiza episódios para uma temporada/saga.
     * @param {object|string} season — objecto {kitsuId, epStart?, epEnd?, label?} ou string kitsuId
     */
    async function renderEpisodesForSeason(season) {
        // Aceita tanto string como objecto
        const kitsuId = typeof season === 'string' ? season : season.kitsuId;
        const epStart = typeof season === 'object' ? (season.epStart ?? null) : null;
        const epEnd   = typeof season === 'object' ? (season.epEnd   ?? null) : null;

        currentSeasonKitsuId = kitsuId;
        const listEl = document.getElementById('episodesList');

        const sagaLabel = (typeof season === 'object' && season.label) ? season.label : null;
        const loadMsg   = sagaLabel ? `A carregar ${escapeHtml(sagaLabel)}...` : 'Carregando episódios...';
        listEl.innerHTML = `<div class="episodes-loading"><div class="loading-spinner"></div><div>${loadMsg}</div></div>`;

        try {
            const episodes = await fetchKitsuEpisodes(kitsuId, epStart, epEnd);

            if (!episodes.length) {
                listEl.innerHTML = `<div class="episodes-loading">📭 Nenhum episódio encontrado nesta temporada.</div>`;
                return;
            }

            // Actualiza o total de episódios no cabeçalho do modal.
            // Para animes com sagas (ex: One Piece), usa o cache base sem filtro de range
            // para mostrar o total real da série, não apenas o da saga actual.
            if (currentAnime) {
                const baseCache = _episodesCache[String(kitsuId)];
                currentAnime.totalEpisodes = baseCache ? baseCache.length : episodes.length;
                updateModalMeta();
            }

            renderEpisodes(kitsuId, episodes);
        } catch (err) {
            console.error('Erro ao carregar episódios:', err);
            listEl.innerHTML = `<div class="episodes-loading">⚠️ Erro ao carregar episódios.<br>
                <small style="color:var(--text-muted)">${escapeHtml(err.message)}</small></div>`;
        }
    }

    function renderEpisodes(kitsuId, episodes) {
        const listEl   = document.getElementById('episodesList');
        const allRatings = getEpRatings();
        const seenEps    = getSeenEps();
        const userName = document.getElementById('epUsernameInput').value.trim();

        listEl.innerHTML = `<div class="episodes-list">${
            episodes.map(ep => {
                const epKey    = `${kitsuId}-${ep.numero}`;
                const epRatings = allRatings[epKey] || {};
                const vals     = Object.values(epRatings).filter(v => typeof v === 'number');
                const notaMedia = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;
                const totalNotas = vals.length;
                const notaUser   = userName ? (epRatings[userName] ?? null) : null;

                const titulo  = ep.titulo || `Episódio ${ep.numero}`;
                const rated   = notaUser !== null;
                const avgText = totalNotas > 0 ? `★ ${notaMedia.toFixed(1)} (${totalNotas})` : '—';
                const selVal  = rated ? Math.round(notaUser) : 0;
                const isSeen  = !!seenEps[epKey];

                const options = `<option value="0" ${!rated ? 'selected' : ''}>— Nota —</option>`
                    + Array.from({ length: 10 }, (_, i) => i + 1)
                          .map(n => `<option value="${n}" ${selVal === n ? 'selected' : ''}>${n}/10</option>`)
                          .join('');

                return `
                <div class="episode-row${isSeen ? ' seen-row' : ''}" id="eprow-${epKey}">
                    <div class="ep-seen-wrap">
                        <button class="ep-seen-btn${isSeen ? ' seen' : ''}"
                                onclick="toggleEpSeen('${epKey}', this)"
                                title="${isSeen ? 'Visto ✓' : 'Marcar como visto'}"
                                aria-label="${isSeen ? 'Marcar como não visto' : 'Marcar como visto'}"
                                aria-pressed="${isSeen}">${isSeen ? '✓' : '👁'}</button>
                    </div>
                    <span class="episode-num">Ep ${ep.numero}</span>
                    <span class="episode-title" title="${escapeHtml(titulo)}">${escapeHtml(titulo)}</span>
                    <span class="episode-avg" id="epavg-${epKey}">${escapeHtml(avgText)}</span>
                    <select class="episode-nota-select ${rated ? 'rated' : ''}"
                            id="sel-${epKey}"
                            aria-label="Nota para episódio ${ep.numero}"
                            onchange="this.classList.toggle('rated', this.value !== '0')">
                        ${options}
                    </select>
                    <button class="episode-save-btn ${rated ? 'saved' : ''}"
                            id="savebtn-${epKey}"
                            onclick="saveEpisodeNota('${epKey}', '${kitsuId}')"
                            aria-label="Guardar nota do episódio ${ep.numero}">
                        ${rated ? '✓ Guardado' : 'Guardar'}
                    </button>
                </div>`;
            }).join('')
        }</div>`;
    }

    /**
     * Guarda a nota de um episódio no localStorage.
     * epKey = "<kitsuId>-<numero>"
     */
    function saveEpisodeNota(epKey, kitsuId) {
        const sel      = document.getElementById('sel-' + epKey);
        const btn      = document.getElementById('savebtn-' + epKey);
        const nota     = parseInt(sel.value, 10);
        const userName = document.getElementById('epUsernameInput').value.trim() || 'Anônimo';

        if (!nota || nota < 1 || nota > 10) {
            sel.style.borderColor = 'var(--danger)';
            setTimeout(() => sel.style.borderColor = '', 1800);
            return;
        }

        // Salva no localStorage
        const allRatings = getEpRatings();
        if (!allRatings[epKey]) allRatings[epKey] = {};
        allRatings[epKey][userName] = nota;
        saveEpRatings(allRatings);

        // Recalcula média
        const vals      = Object.values(allRatings[epKey]).filter(v => typeof v === 'number');
        const notaMedia = vals.reduce((a, b) => a + b, 0) / vals.length;
        const total     = vals.length;

        // Atualiza UI
        const avgEl = document.getElementById('epavg-' + epKey);
        if (avgEl) avgEl.textContent = `★ ${notaMedia.toFixed(1)} (${total})`;

        btn.textContent = '✓ Guardado';
        btn.classList.add('saved');
        sel.classList.add('rated');

        const epNum = epKey.split('-').pop();
        showToast(`✅ Ep ${epNum} avaliado com ${nota}/10!`);
    }

    function submitReview() {
        if (currentRating === 0) {
            shakeElement(document.getElementById('ratingInput'));
            document.getElementById('ratingHint').textContent = '⚠️ Selecione uma nota antes de enviar!';
            document.getElementById('ratingHint').style.color = 'var(--danger)';
            return;
        }

        const text = document.getElementById('reviewInput').value.trim();
        if (!text) {
            document.getElementById('reviewInput').focus();
            document.getElementById('reviewInput').style.borderColor = 'var(--danger)';
            setTimeout(() => document.getElementById('reviewInput').style.borderColor = '', 1800);
            return;
        }

        const userName = document.getElementById('usernameInput').value.trim() || 'Anônimo';

        const review = {
            id:              Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
            animeId:         String(currentAnime.id),
            animeTitle:      currentAnime.title,
            animeImage:      currentAnime.image,
            userName:        userName,
            rating:          parseInt(currentRating, 10),
            comment:         text,
            containsSpoiler: document.getElementById('spoilerCheck').checked,
            likes:           0,
            createdAt:       new Date().toISOString(),
        };

        const reviews = getReviews();
        reviews.unshift(review);   // mais recente primeiro
        saveReviews(reviews);

        closeModal();
        showToast('✅ Resenha enviada com sucesso!');
        renderReviewsFeed();
    }

    function renderReviewsFeed(reviewsFromServer) {
        const feed    = document.getElementById('reviewsFeed');
        const reviews = Array.isArray(reviewsFromServer) ? reviewsFromServer : getReviews();
        const likes   = getLikes();

        if (!reviews.length) {
            feed.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">📝</div>
                    <div>Nenhuma resenha ainda</div>
                    <div style="font-size:0.9rem;margin-top:0.4rem">Seja o primeiro a avaliar um anime!</div>
                </div>`;
            return;
        }

        feed.innerHTML = reviews.map(r => {
            const author  = r.userName || r.username || 'Anônimo';
            const text    = r.comment  || r.review   || '';
            const spoiler = r.containsSpoiler || r.hasSpoiler || false;
            const initial = author[0].toUpperCase();
            const stars   = Array.from({ length: 10 }, (_, i) =>
                `<span class="s${i < r.rating ? ' on' : ''}">★</span>`
            ).join('');
            const dateStr = r.createdAt
                ? new Date(r.createdAt).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' })
                : '';
            const imgSrc  = r.animeImage || 'https://placehold.co/56x80/1f1f26/71717a?text=?';
            const liked   = likes[r.id] ? 'liked' : '';
            const likeCnt = (r.likes || 0) + (likes[r.id] ? 1 : 0);

            const bodyHtml = spoiler
                ? `<div class="spoiler-box blurred" onclick="this.classList.toggle('blurred')" title="Clique para revelar">
                        <div class="spoiler-warning">⚠️ Spoiler — clique para revelar</div>
                        <div class="spoiler-text">${escapeHtml(text)}</div>
                   </div>`
                : `<div class="review-text">${escapeHtml(text)}</div>`;

            return `
            <div class="review-card">
                <div class="review-top">
                    <img class="review-anime-thumb" src="${imgSrc}" alt="${escapeHtml(r.animeTitle || '')}" loading="lazy">
                    <div class="review-info">
                        <div class="review-anime-title">${escapeHtml(r.animeTitle || '')}</div>
                        <div class="review-author-row">
                            <div class="review-avatar" aria-hidden="true">${initial}</div>
                            <span class="review-author-name">${escapeHtml(author)}</span>
                            ${dateStr ? `<span class="review-date">${dateStr}</span>` : ''}
                        </div>
                        <div class="review-stars">
                            ${stars}
                            <span class="review-score-badge">${r.rating}/10</span>
                        </div>
                    </div>
                </div>
                <div class="review-body">${bodyHtml}</div>
                <div class="review-actions">
                    <button class="btn btn-like ${liked}" onclick="likeReview('${r.id}', this)"
                            aria-label="Curtir resenha" aria-pressed="${!!likes[r.id]}">
                        ♥ <span class="like-count">${likeCnt}</span>
                    </button>
                </div>
            </div>`;
        }).join('');
    }

    /**
     * Curtir uma resenha — salvo no localStorage.
     * Cada utilizador (por dispositivo) pode curtir uma vez por resenha.
     */
    function likeReview(reviewId, btn) {
        const likes = getLikes();
        if (likes[reviewId]) return;  // já curtiu — sem descurtir

        likes[reviewId] = true;
        saveLikes(likes);

        // Atualiza a UI imediatamente (sem rerender tudo)
        btn.classList.add('liked');
        btn.setAttribute('aria-pressed', 'true');
        const countEl = btn.querySelector('.like-count');
        if (countEl) countEl.textContent = parseInt(countEl.textContent || '0', 10) + 1;
    }

    /**
     * Marcar / desmarcar episódio como visto.
     * Persiste no localStorage com a chave LS_SEEN.
     */
    function toggleEpSeen(epKey, btn) {
        const seen = getSeenEps();
        const isSeen = !seen[epKey];
        if (isSeen) { seen[epKey] = true; } else { delete seen[epKey]; }
        saveSeenEps(seen);

        btn.classList.toggle('seen', isSeen);
        btn.setAttribute('aria-label', isSeen ? 'Marcar como não visto' : 'Marcar como visto');
        btn.setAttribute('title',      isSeen ? 'Visto ✓' : 'Marcar como visto');
        btn.textContent = isSeen ? '✓' : '👁';

        const row = document.getElementById(`eprow-${epKey}`);
        if (row) row.classList.toggle('seen-row', isSeen);

        refreshStatsIfOpen();
    }

    /**
     * Marca como visto TODOS os episódios actualmente visíveis na lista.
     * Persiste no localStorage (LS_SEEN); o botão fica fora de #episodesList
     * e #seasonsBar, por isso mantém-se visível ao mudar de temporada.
     */
    function markAllVisibleSeen() {
        const rows = document.querySelectorAll('#episodesList .episode-row[id^="eprow-"]');
        if (!rows.length) { showToast('Nenhum episódio visível para marcar.'); return; }

        const seen = getSeenEps();
        let marcados = 0;

        rows.forEach(row => {
            const epKey = row.id.slice('eprow-'.length);
            if (!seen[epKey]) { seen[epKey] = true; marcados++; }

            const btn = row.querySelector('.ep-seen-btn');
            if (btn) {
                btn.classList.add('seen');
                btn.textContent = '✓';
                btn.setAttribute('title', 'Visto ✓');
                btn.setAttribute('aria-label', 'Marcar como não visto');
                btn.setAttribute('aria-pressed', 'true');
            }
            row.classList.add('seen-row');
        });

        saveSeenEps(seen);
        showToast(marcados > 0
            ? `${marcados} episódio${marcados > 1 ? 's' : ''} marcado${marcados > 1 ? 's' : ''} como visto`
            : 'Todos os episódios visíveis já estavam marcados como vistos');

        refreshStatsIfOpen();
    }

    /* ════════════════════════════════════════════════════════════
       DASHBOARD DE ESTATÍSTICAS DO UTILIZADOR
       Métricas calculadas a partir do localStorage 'anireview_seen'.
    ════════════════════════════════════════════════════════════ */
    const MINUTOS_POR_EPISODIO = 24;   // estimativa usada no cálculo do tempo
    let   _statsReqId          = 0;     // evita respostas fora de ordem
    const _epCountCache        = {};    // kitsuId → episodeCount (cache de sessão)

    /** Abre o modal de estatísticas e recalcula os valores. */
    function openStatsModal() {
        document.getElementById('statsModal').classList.add('active');
        renderStats();               // métricas locais (imediatas)
        refreshCompletedCount();     // "concluídos" precisa da contagem da API
    }

    function closeStatsModal() {
        document.getElementById('statsModal').classList.remove('active');
    }

    /**
     * Lê 'anireview_seen' ({ "kitsuId-numero": true }) e agrega:
     * total de episódios vistos e contagem por anime (kitsuId).
     */
    function computeSeenStats() {
        const seen     = getSeenEps();
        const perAnime = {};
        let   total    = 0;

        Object.keys(seen).forEach(key => {
            if (!seen[key]) return;
            const sep = key.lastIndexOf('-');
            if (sep < 1) return;
            const kitsuId = key.slice(0, sep);
            perAnime[kitsuId] = (perAnime[kitsuId] || 0) + 1;
            total++;
        });

        return { total, perAnime, animeIds: Object.keys(perAnime) };
    }

    /** Converte minutos em "Xd Yh" / "Yh" / "Zmin". */
    function formatWatchTime(totalMinutes) {
        const totalHoras = Math.floor(totalMinutes / 60);
        const dias       = Math.floor(totalHoras / 24);
        const horas      = totalHoras % 24;
        if (dias  > 0) return `${dias}d ${horas}h`;
        if (totalHoras > 0) return `${totalHoras}h`;
        return `${Math.round(totalMinutes)}min`;
    }

    /** Desenha os cards com as métricas calculadas do localStorage. */
    function renderStats() {
        const grid = document.getElementById('statsGrid');
        if (!grid) return;

        const stats   = computeSeenStats();
        const minutos = stats.total * MINUTOS_POR_EPISODIO;

        if (!stats.total) {
            grid.innerHTML = `<div class="stats-empty">Ainda não marcaste nenhum episódio como visto.<br>
                Abre um anime → separador <b>🎬 Episódios</b> e começa a marcar. 🍿</div>`;
            return;
        }

        grid.innerHTML = `
            <div class="stat-card">
                <div class="stat-icon">📺</div>
                <div class="stat-value">${stats.total}</div>
                <div class="stat-label">Episódios assistidos</div>
                <div class="stat-sub"></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⏱️</div>
                <div class="stat-value">${formatWatchTime(minutos)}</div>
                <div class="stat-label">Tempo de visualização</div>
                <div class="stat-sub">≈ ${minutos.toLocaleString('pt-BR')} min (${MINUTOS_POR_EPISODIO} min/ep)</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🎬</div>
                <div class="stat-value">${stats.animeIds.length}</div>
                <div class="stat-label">Animes iniciados</div>
                <div class="stat-sub"></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">✅</div>
                <div class="stat-value" id="statCompletedValue">…</div>
                <div class="stat-label">Animes concluídos</div>
                <div class="stat-sub" id="statCompletedSub">A calcular...</div>
            </div>`;
    }

    /** Obtém `episodeCount` dos animes em lote, com cache de sessão. */
    async function fetchEpisodeCounts(ids) {
        const emFalta = ids.filter(id => _epCountCache[id] === undefined);

        // A Kitsu limita page[limit] a 20 (acima disso devolve HTTP 400),
        // por isso dividimos os ids em lotes de 20.
        const TAMANHO_LOTE = 20;

        for (let i = 0; i < emFalta.length; i += TAMANHO_LOTE) {
            const lote = emFalta.slice(i, i + TAMANHO_LOTE);
            const res  = await fetch(
                `${KITSU_BASE}/anime?filter[id]=${encodeURIComponent(lote.join(','))}` +
                `&fields[anime]=episodeCount&page[limit]=${lote.length}`,
                { headers: KITSU_HEADERS }
            );
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const json = await res.json();

            (json.data || []).forEach(item => {
                _epCountCache[item.id] = item.attributes?.episodeCount ?? null;
            });
            // Marca como desconhecidos os que a API não devolveu
            lote.forEach(id => { if (_epCountCache[id] === undefined) _epCountCache[id] = null; });
        }
        return _epCountCache;
    }

    /** Calcula quantos animes têm todos os episódios marcados como vistos. */
    async function refreshCompletedCount() {
        const valEl = document.getElementById('statCompletedValue');
        if (!valEl) return;

        const stats = computeSeenStats();
        const reqId = ++_statsReqId;

        if (!stats.animeIds.length) {
            valEl.textContent = '0';
            const subEl = document.getElementById('statCompletedSub');
            if (subEl) subEl.textContent = '';
            return;
        }

        valEl.textContent = '…';
        try {
            const counts = await fetchEpisodeCounts(stats.animeIds);
            if (reqId !== _statsReqId) return;

            const concluidos = stats.animeIds.filter(id => {
                const totalEps = counts[id];
                return totalEps && stats.perAnime[id] >= totalEps;
            }).length;

            valEl.textContent = concluidos;
            const subEl = document.getElementById('statCompletedSub');
            if (subEl) subEl.textContent = `de ${stats.animeIds.length} iniciados`;
        } catch (err) {
            console.warn('Contagem de animes concluídos indisponível:', err);
            if (reqId !== _statsReqId) return;
            valEl.textContent = '—';
            const subEl = document.getElementById('statCompletedSub');
            if (subEl) subEl.textContent = 'indisponível sem ligação';
        }
    }

    /** Recalcula o painel se estiver aberto (ao marcar/desmarcar episódios). */
    function refreshStatsIfOpen() {
        const modal = document.getElementById('statsModal');
        if (modal && modal.classList.contains('active')) {
            renderStats();
            refreshCompletedCount();
        }
    }

    /* ════════════════════════════════════════════════════════════
       UTILITÁRIOS
    ════════════════════════════════════════════════════════════ */

    function escapeHtml(str) {
        if (str == null) return '';
        const d = document.createElement('div');
        d.textContent = String(str);
        return d.innerHTML;
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3200);
    }

    function shakeElement(el) {
        el.style.animation = 'none';
        el.offsetHeight;
        el.style.animation = 'shake 0.4s ease';
    }

    /* ════════════════════════════════════════════════════════════
       ACESSIBILIDADE — GESTÃO DE FOCO NOS DIÁLOGOS (WCAG 2.4.3)
       Recorda quem abriu o diálogo, prende o Tab lá dentro e
       devolve o foco ao elemento de origem quando fecha.
    ════════════════════════════════════════════════════════════ */
    const _dialogStack = [];
    let _lastFocusedOutside = null;

    function _focusableIn(root) {
        return Array.from(root.querySelectorAll(
            'a[href], button:not([disabled]), input:not([disabled]), ' +
            'select:not([disabled]), textarea:not([disabled]), iframe, ' +
            '[tabindex]:not([tabindex="-1"])'
        )).filter(el => el.offsetWidth > 0 || el.offsetHeight > 0 || el === document.activeElement);
    }

    // Guarda o último elemento focado fora de qualquer diálogo
    document.addEventListener('focusin', e => {
        const top = _dialogStack[_dialogStack.length - 1];
        if (!top || !top.overlay.contains(e.target)) _lastFocusedOutside = e.target;
    });

    function _onDialogOpened(overlay) {
        _dialogStack.push({ overlay, opener: _lastFocusedOutside });
        // Se nada dentro do diálogo recebeu foco, foca o primeiro controlo
        if (!overlay.contains(document.activeElement)) {
            const items = _focusableIn(overlay);
            (items[0] || overlay).focus();
        }
    }

    function _onDialogClosed(overlay) {
        const i = _dialogStack.findIndex(d => d.overlay === overlay);
        if (i === -1) return;
        const { opener } = _dialogStack.splice(i, 1)[0];
        if (opener && typeof opener.focus === 'function' && document.contains(opener)) {
            opener.focus();
        }
    }

    // Observa a abertura/fecho (.active) de cada modal e gere o foco
    document.querySelectorAll('.modal-overlay').forEach(overlay => {
        let wasOpen = overlay.classList.contains('active');
        new MutationObserver(() => {
            const isOpen = overlay.classList.contains('active');
            if (isOpen === wasOpen) return;
            wasOpen = isOpen;
            if (isOpen) _onDialogOpened(overlay); else _onDialogClosed(overlay);
        }).observe(overlay, { attributes: true, attributeFilter: ['class'] });
    });

    // Prende o Tab dentro do diálogo aberto mais recente
    document.addEventListener('keydown', e => {
        if (e.key !== 'Tab') return;
        const top = _dialogStack[_dialogStack.length - 1];
        if (!top) return;
        const items = _focusableIn(top.overlay);
        if (!items.length) { e.preventDefault(); return; }
        const first = items[0], last = items[items.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    });

    /* Fechar modal com clique fora ou Escape */
    document.getElementById('animeModal').addEventListener('click', e => {
        if (e.target.id === 'animeModal') closeModal();
    });
    document.getElementById('statsModal').addEventListener('click', e => {
        if (e.target.id === 'statsModal') closeStatsModal();
    });
    document.getElementById('trailerModal').addEventListener('click', e => {
        if (e.target.id === 'trailerModal') closeTrailer();
    });
    document.getElementById('calendarModal').addEventListener('click', e => {
        if (e.target.id === 'calendarModal') closeCalendar();
    });
    document.addEventListener('keydown', e => {
        if (e.key !== 'Escape') return;
        // Fecha por camadas: trailer → detalhes → estatísticas → calendário → tema
        if (document.getElementById('trailerModal').classList.contains('active')) { closeTrailer(); return; }
        if (document.getElementById('animeModal').classList.contains('active'))   { closeModal();   return; }
        if (document.getElementById('statsModal').classList.contains('active'))   { closeStatsModal(); return; }
        if (document.getElementById('calendarModal').classList.contains('active')){ closeCalendar(); return; }
        closeThemeMenu();
    });
    </script>
    <script src="script.js"></script>
</body>
</html>
