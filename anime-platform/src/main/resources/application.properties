server.port=8080

# ── PostgreSQL (base de dados única) ─────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/anireview
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ─────────────────────────────────────────────────────────
# ddl-auto=update cria/actualiza as tabelas automaticamente a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ─────────────────────────────────────────────────────────────────────
# O segredo tem de ter pelo menos 32 bytes (256 bits) para HS256.
app.jwt.secret=AniReviewSuperSecretKeyChangeMeInProduction1234567890
# Validade do token em milissegundos (24 horas)
app.jwt.expiration-ms=86400000

# Desactiva cache do Thymeleaf em dev (recarrega templates sem reiniciar)
spring.thymeleaf.cache=false

# Serve ficheiros estáticos de src/main/resources/static/
spring.web.resources.static-locations=classpath:/static/

# Log de requests HTTP (útil para debug de CORS e rotas)
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation=INFO

# Evita erro de "No main manifest attribute" se executado como JAR
spring.main.banner-mode=off
