        /**
         * Retorna o título traduzido de um episódio.
         * Prioridade:
         *   1. Mapa estático PT-BR (curado ou traduzido via MyMemory)
         *   2. Campo "titulo" do backend
         *   3. Fallback limpo: "Episódio N" (nunca exibe texto em inglês/japonês)
         */
        function getEpisodeTitle(ep) {
            const mapped = EPISODE_TITLES_PT[ep.id];
            // mapped === null significa "foi processado mas sem tradução disponível"
            if (mapped === undefined) {
                // Ainda não foi processado: usa campo do backend ou fallback
                return ep.titulo && isLikelyPortuguese(ep.titulo) ? ep.titulo : `Episódio ${ep.numero}`;
            }
            if (mapped === null || mapped === '') {
                return `Episódio ${ep.numero}`;
            }
            return mapped;
        }

        /**
         * Dado um kitsuId de temporada, retorna o label do ANIME_SEASONS_MAP.
         */
        function getKitsuSeasonLabel(kitsuId) {
            for (const entry of Object.values(ANIME_SEASONS_MAP)) {
                const found = entry.seasons.find(s => s.kitsuId === String(kitsuId));
                if (found) return found.label;
            }
            return null;
        }

        /**
         * Retorna o nome traduzido de uma temporada do backend (TemporadaDTO).
         */
        function getSeasonName(season) {
            // Tenta pelo ID da temporada do backend
            const match = (season.nome || '').match(/(\d+)/);
            if (match) {
                const n = parseInt(match[1], 10);
                return `${n}ª Temporada`;
            }
            return season.nome || 'Temporada';
        }

        /* ════════════════════════════════
           TEMPORADAS E EPISÓDIOS — SISTEMA KITSU DINÂMICO
        ════════════════════════════════ */

        /**
         * Inicializa o dropdown de temporadas no painel de episódios.
         * Usa o currentKitsuSeasons quando disponível,
         * caso contrário cai no backend Spring Boot.
         */
        function initSeasonSelect() {
            const bar  = document.getElementById('seasonsBar');
            const list = document.getElementById('episodesList');

            bar.innerHTML  = '';
            list.innerHTML = '<div class="episodes-loading"><div class="loading-spinner"></div><div>Carregando temporadas...</div></div>';

            if (currentKitsuSeasons.length > 0) {
                // Determina qual temporada mostrar pré-selecionada
                const activeKitsuId = String(currentAnime.id);
                const defaultSeason = currentKitsuSeasons.find(s => s.kitsuId === activeKitsuId)
                                   || currentKitsuSeasons[0];

                // Constrói o dropdown com a temporada correta já marcada como ativa
                buildKitsuSeasonSelect(currentKitsuSeasons, defaultSeason.kitsuId);
                selectKitsuSeason(defaultSeason.kitsuId);
            } else {
                // ── Modo backend: carrega temporadas do servidor Spring Boot ──
                loadSeasonsFromBackend(currentAnime.id);
            }
        }

        /**
         * Constrói o dropdown personalizado de temporadas (botão + lista).
         */
        function buildKitsuSeasonSelect(seasons, activeKitsuId) {
            const bar = document.getElementById('seasonsBar');
            bar.innerHTML = '';
            buildSeasonDropdown(bar, seasons, activeKitsuId, (kitsuId) => {
                selectKitsuSeason(kitsuId);
            });
        }

        /**
         * Cria o markup do dropdown personalizado dentro de `container`.
         * @param {HTMLElement} container  — elemento .seasons-bar
         * @param {Array}       seasons    — [{label, kitsuId}] ou [{id, nome}] do backend
         * @param {string}      activeId   — id da opção pré-selecionada
         * @param {Function}    onSelect   — callback(id) ao escolher opção
         */
        function buildSeasonDropdown(container, seasons, activeId, onSelect) {
            const activeId_ = String(activeId);
            const active    = seasons.find(s => String(s.kitsuId || s.id) === activeId_) || seasons[0];
            const activeLabel = active ? (active.label || getSeasonName(active)) : 'Temporadas';

            // ── Botão principal ──
            const btn = document.createElement('button');
            btn.type      = 'button';
            btn.className = 'season-btn';
            btn.id        = 'seasonDropdownBtn';
            btn.setAttribute('aria-haspopup', 'listbox');
            btn.setAttribute('aria-expanded', 'false');
            btn.innerHTML = `
                <span class="season-btn-label">📺 ${escapeHtml(activeLabel)}</span>
                <span class="season-btn-arrow" aria-hidden="true">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"/>
                    </svg>
                </span>`;

            // ── Função para fechar o dropdown ──
            function closeDropdown() {
                const existing = document.getElementById('seasonDropdownList');
                if (existing) existing.remove();
                btn.classList.remove('open');
                btn.setAttribute('aria-expanded', 'false');
            }

            // ── Função para abrir o dropdown ──
            function openDropdown() {
                // Se já estiver aberto, fecha
                if (document.getElementById('seasonDropdownList')) {
                    closeDropdown();
                    return;
                }

                btn.classList.add('open');
                btn.setAttribute('aria-expanded', 'true');

                const list = document.createElement('ul');
                list.className = 'season-dropdown';
                list.id        = 'seasonDropdownList';
                list.setAttribute('role', 'listbox');

                seasons.forEach(s => {
                    const id    = String(s.kitsuId || s.id);
                    const label = s.label || getSeasonName(s);
                    const li    = document.createElement('li');
                    li.className  = `season-option${id === activeId_ ? ' active' : ''}`;
                    li.setAttribute('role', 'option');
                    li.setAttribute('aria-selected', id === activeId_ ? 'true' : 'false');
                    li.setAttribute('data-id', id);
                    li.textContent = `📺 ${label}`;

                    li.addEventListener('click', () => {
                        // Atualiza o label do botão
                        btn.querySelector('.season-btn-label').textContent = `📺 ${label}`;
                        // Marca ativo
                        list.querySelectorAll('.season-option').forEach(el => {
                            el.classList.remove('active');
                            el.setAttribute('aria-selected', 'false');
                        });
                        li.classList.add('active');
                        li.setAttribute('aria-selected', 'true');
                        closeDropdown();
                        onSelect(id);
                    });

                    list.appendChild(li);
                });

                container.appendChild(list);

                // Fecha ao clicar fora (captura no próximo tick para não capturar o click atual)
                setTimeout(() => {
                    document.addEventListener('click', function handler(e) {
                        if (!container.contains(e.target)) {
                            closeDropdown();
                            document.removeEventListener('click', handler);
                        }
                    });
                }, 0);
            }

            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                openDropdown();
            });

            container.appendChild(btn);
        }

        /**
         * Seleciona uma temporada Kitsu:
         * 1. Atualiza o label do botão visualmente
         * 2. Carrega episódios do backend + traduz títulos PT-BR
         */
        function selectKitsuSeason(kitsuId) {
            currentSeasonId = kitsuId;
            loadEpisodesForKitsuId(kitsuId);
        }

        /**
         * Busca episódios para um kitsuId no backend Spring Boot.
         * Ao mesmo tempo, busca os títulos dos episódios via Kitsu API
         * para enriquecer a lista com traduções PT-BR quando o mapa
         * estático não cobre o episódio.
         */
        async function loadEpisodesForKitsuId(kitsuId) {
            const list     = document.getElementById('episodesList');
            const userName = document.getElementById('epUsernameInput').value.trim();

            list.innerHTML = '<div class="episodes-loading"><div class="loading-spinner"></div><div>Carregando episódios...</div></div>';

            try {
                // Busca episódios do backend e títulos Kitsu em paralelo
                const [seasonsResult, kitsuTitles] = await Promise.all([
                    fetch(`${API_BASE}/api/animes/${kitsuId}/seasons`)
                        .then(r => r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`))),
                    fetchKitsuEpisodeTitles(kitsuId)
                ]);

                if (!seasonsResult || seasonsResult.length === 0) {
                    list.innerHTML = `
                        <div class="episodes-loading">
                            📭 Nenhum episódio cadastrado para esta temporada ainda.<br>
                            <small style="color:var(--text-muted)">Avalie um episódio para criar os registros.</small>
                        </div>`;
                    return;
                }

                const seasonId = seasonsResult[0].id;
                currentSeasonId = seasonId;

                const url = `${API_BASE}/api/seasons/${seasonId}/episodes`
                           + (userName ? `?userName=${encodeURIComponent(userName)}` : '');
                const epRes = await fetch(url);
                if (!epRes.ok) throw new Error(`HTTP ${epRes.status}`);
                const episodios = await epRes.json();

                // Se há episódios sem tradução estática, informa o usuário enquanto traduz
                const precisaTraducao = episodios.some(ep => !EPISODE_TITLES_PT[`${kitsuId}-${ep.numero}`]);
                if (precisaTraducao) {
                    list.innerHTML = '<div class="episodes-loading"><div class="loading-spinner"></div><div>Traduzindo títulos para PT-BR...</div></div>';
                }

                // Aguarda enriquecimento com títulos PT-BR (tradução síncrona antes de renderizar)
                await enrichEpisodesWithKitsuTitles(episodios, kitsuId, kitsuTitles);

                renderEpisodes(episodios);

            } catch (err) {
                console.error('Erro ao carregar episódios:', err);
                list.innerHTML = `
                    <div class="episodes-loading">
                        ⚠️ Erro ao carregar episódios.<br>
                        <small style="color:var(--text-muted)">${escapeHtml(err.message)}</small>
                    </div>`;
            }
        }

        /**
         * Busca os títulos de episódios de um anime via Kitsu API.
         * Retorna um Map: número do episódio → { ptTitle, enTitle }
         *   ptTitle: título em PT-BR se disponível na API (ou null)
         *   enTitle: título em inglês/canonicalTitle como fonte para tradução (ou null)
         * Usa cache para evitar chamadas repetidas.
         */
        async function fetchKitsuEpisodeTitles(kitsuId) {
            if (_kitsuEpisodesCache[kitsuId]) return _kitsuEpisodesCache[kitsuId];

            const titleMap = new Map();
            try {
                let url = `${KITSU_BASE}/episodes?filter[mediaId]=${kitsuId}&filter[mediaType]=anime`
                        + `&page[limit]=20&fields[episodes]=number,titles,canonicalTitle`;
                const MAX_PAGES = 8; // máximo 160 episódios

                for (let page = 0; page < MAX_PAGES; page++) {
                    const res = await fetch(url, { headers: KITSU_HEADERS });
                    if (!res.ok) break;
                    const data = await res.json();
                    const items = data.data || [];

                    for (const ep of items) {
                        const num    = ep.attributes?.number;
                        const titles = ep.attributes?.titles || {};
                        // PT-BR nativo da API (raramente preenchido)
                        const ptTitle = titles.pt_br || titles.pt || null;
                        // Melhor título em inglês disponível para traduzir
                        const enTitle = ep.attributes?.canonicalTitle
                                     || titles.en
                                     || titles.en_us
                                     || null;
                        if (num != null) titleMap.set(num, { ptTitle, enTitle });
                    }

                    const next = data.links?.next;
                    if (!next || items.length === 0) break;
                    url = next;
                }

                _kitsuEpisodesCache[kitsuId] = titleMap;
            } catch (err) {
                console.warn('fetchKitsuEpisodeTitles falhou para', kitsuId, err);
            }
            return titleMap;
        }

        /**
         * Enriquece a lista de episódios do backend com títulos PT-BR.
         * Ordem de prioridade para cada episódio:
         *   1. Mapa estático EPISODE_TITLES_PT (títulos curados manualmente)
         *   2. Campo PT-BR nativo da Kitsu API
         *   3. Tradução do título inglês via MyMemory API (await — traduz ANTES de renderizar)
         *   4. Fallback limpo: "Episódio N" (sem inglês, sem japonês)
         *
         * Retorna Promise — aguarda todas as traduções antes de continuar.
         */
        async function enrichEpisodesWithKitsuTitles(episodios, kitsuId, kitsuTitles) {
            // Cache de traduções desta sessão para não traduzir o mesmo texto duas vezes
            const translationCache = {};

            const tasks = episodios.map(async ep => {
                const staticKey = `${kitsuId}-${ep.numero}`;

                // 1. Já tem tradução estática — não mexe
                if (EPISODE_TITLES_PT[staticKey]) return;

                const entry = kitsuTitles.get(ep.numero);

                // 2. API tem PT-BR nativo
                if (entry?.ptTitle && isLikelyPortuguese(entry.ptTitle)) {
                    EPISODE_TITLES_PT[staticKey] = entry.ptTitle;
                    return;
                }

                // 3. Tem título em inglês → tenta traduzir
                if (entry?.enTitle) {
                    const src = entry.ptTitle || entry.enTitle; // usa ptTitle se existir mas não parecer PT
                    if (translationCache[src] !== undefined) {
                        EPISODE_TITLES_PT[staticKey] = translationCache[src];
                        return;
                    }
                    const translated = await translateToPortuguese(src);
                    if (translated) {
                        EPISODE_TITLES_PT[staticKey] = translated;
                        translationCache[src] = translated;
                        return;
                    }
                    // Tradução falhou — armazena null para usar fallback "Episódio N"
                    translationCache[src] = null;
                }

                // 4. Fallback: "Episódio N" — sem título em inglês no DOM
                EPISODE_TITLES_PT[staticKey] = null; // getEpisodeTitle trata null → "Episódio N"
            });

            // Aguarda todas as traduções (com timeout global de 6s para não travar a UI)
            await Promise.race([
                Promise.all(tasks),
                new Promise(resolve => setTimeout(resolve, 6000))
            ]);
        }

        /** Heurística: verifica se o texto parece português */
        function isLikelyPortuguese(text) {
            if (!text) return false;
            const ptMarkers = /\b(de|da|do|das|dos|uma|um|em|no|na|com|que|para|pela|pelo|ou|como|seu|sua|não|ele|ela)\b/i;
            return ptMarkers.test(text);
        }

        /**
         * Traduz um texto EN → PT-BR via MyMemory API (gratuita, sem chave).
         * Retorna o texto traduzido ou null se falhar / resultado inválido.
         */
        async function translateToPortuguese(text) {
            if (!text || text.length > 300) return null;
            try {
                const url = `https://api.mymemory.translated.net/get`
                          + `?q=${encodeURIComponent(text)}&langpair=en|pt-BR&de=anireview@placeholder.com`;
                const res = await fetch(url);
                if (!res.ok) return null;
                const data = await res.json();
                const translated = data?.responseData?.translatedText;
                // Rejeita: mesmo texto, mensagem de erro da API, ou resposta vazia
                if (!translated
                    || translated.trim() === text.trim()
                    || translated.toUpperCase().startsWith('PLEASE')
                    || translated.toUpperCase().startsWith('MYMEMORY')
                    || data?.responseStatus !== 200) {
                    return null;
                }
                return translated;
            } catch {
                return null;
            }
        }

        /* ── Fallback: modo backend puro (animes sem mapeamento Kitsu) ── */

        async function loadSeasonsFromBackend(animeId) {
            const bar  = document.getElementById('seasonsBar');
            const list = document.getElementById('episodesList');

            try {
                const res = await fetch(`${API_BASE}/api/animes/${animeId}/seasons`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                currentSeasons = await res.json();

                if (!currentSeasons || currentSeasons.length === 0) {
                    bar.innerHTML  = '';
                    list.innerHTML = `<div class="episodes-loading">📭 Nenhuma temporada encontrada.<br>
                        <small style="color:var(--text-muted)">Avalie um episódio primeiro para criá-las.</small></div>`;
                    return;
                }

                // Usa o dropdown personalizado, igual ao modo Kitsu
                const seasonsForDropdown = currentSeasons.map(s => ({
                    id:    s.id,
                    label: getSeasonName(s),
                }));
                bar.innerHTML = '';
                buildSeasonDropdown(bar, seasonsForDropdown, seasonsForDropdown[0].id, (id) => {
                    selectBackendSeason(id);
                });

                selectBackendSeason(currentSeasons[0].id);

            } catch (err) {
                console.error('Erro ao carregar temporadas:', err);
                list.innerHTML = `<div class="episodes-loading">⚠️ Erro ao carregar temporadas.<br>
                    <small style="color:var(--text-muted)">${escapeHtml(err.message)}</small></div>`;
            }
        }

        function selectBackendSeason(seasonId) {
            currentSeasonId = seasonId;
            loadEpisodesFromBackend(seasonId);
        }

        async function loadEpisodesFromBackend(seasonId) {
            const list     = document.getElementById('episodesList');
            const userName = document.getElementById('epUsernameInput').value.trim();
            const url      = `${API_BASE}/api/seasons/${seasonId}/episodes`
                           + (userName ? `?userName=${encodeURIComponent(userName)}` : '');

            list.innerHTML = '<div class="episodes-loading"><div class="loading-spinner"></div><div>Carregando episódios...</div></div>';

            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const episodios = await res.json();
                renderEpisodes(episodios);
            } catch (err) {
                console.error('Erro ao carregar episódios:', err);
                list.innerHTML = `<div class="episodes-loading">⚠️ Erro ao carregar episódios.<br>
                    <small style="color:var(--text-muted)">${escapeHtml(err.message)}</small></div>`;
            }
        }

        /** Renderiza a lista de episódios com seletor de nota e botão guardar. */
        function renderEpisodes(episodios) {
            const list = document.getElementById('episodesList');

            if (!episodios || episodios.length === 0) {
                list.innerHTML = `<div class="episodes-loading">📭 Nenhum episódio encontrado nesta temporada.</div>`;
                return;
            }

            list.innerHTML = `<div class="episodes-list">${
                episodios.map(ep => {
                    const rated   = ep.notaUsuario != null;
                    const avgText = ep.notaMedia > 0
                        ? `★ ${ep.notaMedia.toFixed(1)} (${ep.totalNotas})`
                        : '—';
                    const selectVal = rated ? Math.round(ep.notaUsuario) : 0;
                    // Usa título traduzido PT-BR quando disponível
                    const titulo  = getEpisodeTitle(ep);

                    const options = `<option value="0" ${!rated ? 'selected' : ''}>— Nota —</option>`
                        + Array.from({ length: 10 }, (_, i) => i + 1)
                              .map(n => `<option value="${n}" ${selectVal === n ? 'selected' : ''}>${n}/10</option>`)
                              .join('');

                    return `
                    <div class="episode-row" id="eprow-${ep.id}">
                        <span class="episode-num">Ep ${ep.numero}</span>
                        <span class="episode-title" title="${escapeHtml(titulo)}">${escapeHtml(titulo)}</span>
                        <span class="episode-avg" title="${ep.totalNotas} avaliação(ões)">${escapeHtml(avgText)}</span>
                        <select class="episode-nota-select ${rated ? 'rated' : ''}"
                                id="sel-${ep.id}"
                                aria-label="Nota para episódio ${ep.numero}"
                                onchange="this.classList.toggle('rated', this.value !== '0')">
                            ${options}
                        </select>
                        <button class="episode-save-btn"
                                id="savebtn-${ep.id}"
                                onclick="saveEpisodeNota('${ep.id}', '${ep.animeId}')"
                                aria-label="Guardar nota do episódio ${ep.numero}">
                            ${rated ? '✓ Guardado' : 'Guardar'}
                        </button>
                    </div>`;
                }).join('')
            }</div>`;
        }

        /** Guarda/actualiza a nota de um episódio. */
        async function saveEpisodeNota(episodioId, animeId) {
            const sel     = document.getElementById('sel-' + episodioId);
            const btn     = document.getElementById('savebtn-' + episodioId);
            const nota    = parseInt(sel.value, 10);
            const userName = document.getElementById('epUsernameInput').value.trim() || 'Anônimo';

            if (!nota || nota < 1 || nota > 10) {
                sel.style.borderColor = 'var(--danger)';
                setTimeout(() => sel.style.borderColor = '', 1800);
                return;
            }

            btn.disabled   = true;
            btn.textContent = '...';

            try {
                const res = await fetch(`${API_BASE}/api/episodes/review`, {
                    method:  'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body:    JSON.stringify({
                        episodioId,
                        animeId,
                        nota,
                        userName
                    })
                });

                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.error || `HTTP ${res.status}`);
                }

                const updated = await res.json();

                // Actualiza média exibida
                const avgEl = document.querySelector(`#eprow-${episodioId} .episode-avg`);
                if (avgEl) {
                    const avgText = updated.notaMedia > 0
                        ? `★ ${updated.notaMedia.toFixed(1)} (${updated.totalNotas})`
                        : '—';
                    avgEl.textContent = avgText;
                }

                // Feedback visual
                btn.textContent = '✓ Guardado';
                btn.classList.add('saved');
                sel.classList.add('rated');
                showToast(`✅ Ep ${episodioId.split('-').pop()} avaliado com ${nota}/10!`);

            } catch (err) {
                console.error('Erro ao guardar nota:', err);
                btn.disabled    = false;
                btn.textContent = 'Guardar';
                alert('Erro ao guardar: ' + err.message);
            }
        }

        // Recarrega episódios quando o utilizador muda o nome (para buscar notas do novo nome)
        document.addEventListener('DOMContentLoaded', () => {
            const epInput = document.getElementById('epUsernameInput');
            if (epInput) {
                let debounce;
                epInput.addEventListener('input', () => {
                    clearTimeout(debounce);
                    debounce = setTimeout(() => {
                        if (!currentSeasonId) return;
                        // Re-usa a função correta dependendo do modo
                        if (currentKitsuSeasons.length > 0) {
                            loadEpisodesForKitsuId(currentSeasonId.includes('-s')
                                ? String(currentAnime.id) // era seasonId do backend
                                : currentSeasonId);
                        } else {
                            loadEpisodesFromBackend(currentSeasonId);
                        }
                    }, 600);
                });
            }
        });

        /* ════════════════════════════════
           RESENHAS
        ════════════════════════════════ */
        async function submitReview() {
            if (currentRating === 0) {
                shakeElement(document.getElementById('ratingInput'));
                document.getElementById('ratingHint').textContent = '⚠️ Selecione uma nota antes de enviar!';
                document.getElementById('ratingHint').style.color = 'var(--danger)';
                return;
            }

            const text = document.getElementById('reviewInput').value.trim();
            if (!text) {
                document.getElementById('reviewInput').focus();
                document.getElementById('reviewInput').style.borderColor = 'var(--danger)';
                setTimeout(() => document.getElementById('reviewInput').style.borderColor = '', 1800);
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled   = true;
            btn.textContent = 'Enviando...';

            const payload = {
                animeId:         String(currentAnime.id),
                animeTitle:      currentAnime.title,
                animeImage:      currentAnime.image,
                userName:        document.getElementById('usernameInput').value.trim() || 'Anônimo',
                rating:          parseInt(currentRating, 10),
                comment:         text,
                containsSpoiler: document.getElementById('spoilerCheck').checked
            };

            try {
                const res = await fetch(`${API_BASE}/api/reviews`, {
                    method:  'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body:    JSON.stringify(payload)
                });

                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.message || `HTTP ${res.status}`);
                }

                closeModal();
                showToast('✅ Resenha enviada com sucesso!');
                await loadReviews();               // atualiza feed sem F5
            } catch (err) {
                console.error('Erro ao enviar resenha:', err);
                btn.disabled    = false;
                btn.textContent = 'Enviar Resenha';
                alert('Erro ao enviar: ' + err.message);
            }
        }

        async function loadReviews() {
            try {
                const res = await fetch(`${API_BASE}/api/reviews`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const reviews = await res.json();
                displayReviews(reviews);
            } catch (err) {
                console.error('Erro ao carregar resenhas:', err);
                document.getElementById('reviewsFeed').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">⚠️</div>
                        <div>Erro ao carregar resenhas</div>
                        <div style="font-size:0.83rem;margin-top:0.4rem;color:var(--text-muted)">
                            Verifique se o servidor está em http://localhost:8080
                        </div>
                    </div>`;
            }
        }

        function displayReviews(reviews) {
            const feed = document.getElementById('reviewsFeed');

            if (!reviews || reviews.length === 0) {
                feed.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📝</div>
                        <div>Nenhuma resenha ainda</div>
                        <div style="font-size:0.9rem;margin-top:0.4rem">Seja o primeiro a avaliar um anime!</div>
                    </div>`;
                return;
            }

            feed.innerHTML = reviews.map(r => {
                // Suporte aos dois nomes de campos (novo: userName/comment/containsSpoiler
                // + legado: username/review/hasSpoiler) para compatibilidade total
                const author   = r.userName || r.username || 'Anônimo';
                const text     = r.comment  || r.review   || '';
                const spoiler  = r.containsSpoiler || r.hasSpoiler || false;

                const initial  = author[0].toUpperCase();
                const stars    = Array.from({ length: 10 }, (_, i) =>
                    `<span class="s${i < r.rating ? ' on' : ''}">★</span>`
                ).join('');
                const dateStr  = r.createdAt
                    ? new Date(r.createdAt).toLocaleDateString('pt-BR', { day:'2-digit', month:'short', year:'numeric' })
                    : '';
                const imgSrc   = r.animeImage || 'https://placehold.co/56x80/1f1f26/71717a?text=?';

                const bodyHtml = spoiler
                    ? `<div class="spoiler-box blurred" onclick="this.classList.toggle('blurred')" title="Clique para revelar">
                            <div class="spoiler-warning">⚠️ Spoiler — clique para revelar</div>
                            <div class="spoiler-text">${escapeHtml(text)}</div>
                       </div>`
                    : `<div class="review-text">${escapeHtml(text)}</div>`;

                return `
                <div class="review-card">
                    <div class="review-top">
                        <img class="review-anime-thumb" src="${imgSrc}" alt="${escapeHtml(r.animeTitle)}" loading="lazy">
                        <div class="review-info">
                            <div class="review-anime-title">${escapeHtml(r.animeTitle)}</div>
                            <div class="review-author-row">
                                <div class="review-avatar" aria-hidden="true">${initial}</div>
                                <span class="review-author-name">${escapeHtml(author)}</span>
                                ${dateStr ? `<span class="review-date">${dateStr}</span>` : ''}
                            </div>
                            <div class="review-stars">
                                ${stars}
                                <span class="review-score-badge">${r.rating}/10</span>
                            </div>
                        </div>
                    </div>
                    <div class="review-body">${bodyHtml}</div>
                    <div class="review-actions">
                        <button class="btn btn-like" onclick="likeReview('${r.id}', this)" aria-label="Curtir resenha">
                            ♥ <span class="like-count">${r.likes || 0}</span>
                        </button>
                    </div>
                </div>`;
            }).join('');
        }

        async function likeReview(id, btn) {
            try {
                const res = await fetch(`${API_BASE}/api/reviews/${id}/like`, { method: 'POST' });
                if (res.ok) {
                    const data = await res.json();
                    btn.querySelector('.like-count').textContent = data.likes;
                    btn.classList.add('liked');
                }
            } catch (err) { console.error('Erro ao curtir:', err); }
        }

        /* ════════════════════════════════
           UTILITÁRIOS
        ════════════════════════════════ */
        function escapeHtml(str) {
            if (!str) return '';
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3200);
        }

        function shakeElement(el) {
            el.style.animation = 'none';
            el.offsetHeight;   // reflow
            el.style.animation = 'shake 0.4s ease';
        }

        /* ── Fechar modal ── */
        document.getElementById('animeModal').addEventListener('click', e => {
            if (e.target.id === 'animeModal') closeModal();
        });
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeModal();
        });
    </script>

    <style>
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            20%      { transform: translateX(-6px); }
            40%      { transform: translateX(6px); }
            60%      { transform: translateX(-4px); }
            80%      { transform: translateX(4px); }
        }
    </style>
</body>
</html>
