<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniReview - Plataforma de Animes</title>
    <style>
        /* ===== Reset & Variáveis ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary:    #0d0d0f;
            --bg-secondary:  #16161a;
            --bg-card:       #1f1f26;
            --bg-card-hover: #252530;
            --accent:        #7c3aed;
            --accent-hover:  #8b5cf6;
            --accent-glow:   rgba(124, 58, 237, 0.35);
            --text-primary:  #f4f4f5;
            --text-secondary:#a1a1aa;
            --text-muted:    #71717a;
            --border:        #27272a;
            --star:          #3f3f46;
            --star-filled:   #fbbf24;
            --success:       #22c55e;
            --warning:       #eab308;
            --danger:        #ef4444;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* ===== Toast de Sucesso ===== */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--success);
            color: #fff;
            padding: 0.85rem 1.4rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 8px 30px rgba(34, 197, 94, 0.4);
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            transform: translateY(120%);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .toast.show { transform: translateY(0); }

        /* ===== Header ===== */
        header {
            background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
            border-bottom: 1px solid var(--border);
            padding: 1.25rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 1.75rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent) 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .search-container {
            flex: 1;
            max-width: 480px;
            min-width: 250px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 3rem;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: all 0.3s;
        }
        .search-input::placeholder { color: var(--text-muted); }
        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        .search-btn {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--accent);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: background 0.2s;
        }
        .search-btn:hover { background: var(--accent-hover); }

        /* ===== Main ===== */
        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        section { margin-bottom: 3rem; }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        h2 {
            font-size: 1.4rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        h2::before {
            content: '';
            width: 4px;
            height: 24px;
            background: linear-gradient(180deg, var(--accent) 0%, #a855f7 100%);
            border-radius: 2px;
            flex-shrink: 0;
        }

        /* ===== Anime Grid ===== */
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 1.5rem;
        }

        .anime-card {
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid transparent;
        }
        .anime-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent);
            box-shadow: 0 20px 40px var(--accent-glow);
        }

        .anime-card-image-container { overflow: hidden; position: relative; }

        .anime-card-image {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            transition: transform 0.3s;
            display: block;
        }
        .anime-card:hover .anime-card-image { transform: scale(1.05); }

        .anime-card-score {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.85);
            padding: 0.3rem 0.6rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            backdrop-filter: blur(4px);
        }

        .anime-card-info { padding: 1rem; }

        .anime-card-title {
            font-size: 0.9rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 0.4rem;
        }

        .anime-card-meta { font-size: 0.75rem; color: var(--text-muted); }

        /* ===== Review Cards ===== */
        .reviews-feed { display: flex; flex-direction: column; gap: 1.25rem; }

        .review-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid var(--border);
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .review-card:hover {
            border-color: var(--accent);
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        /* Linha superior: capa + info + nota */
        .review-top {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .review-anime-thumb {
            width: 56px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .review-info { flex: 1; min-width: 0; }

        .review-anime-title {
            font-weight: 700;
            font-size: 1rem;
            color: var(--accent);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 0.2rem;
        }

        /* Avatar + autor */
        .review-author-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.4rem;
        }

        .review-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }

        .review-author-name {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .review-date {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-left: auto;
        }

        /* Estrelas da nota */
        .review-stars {
            display: flex;
            align-items: center;
            gap: 2px;
            margin-top: 0.1rem;
        }
        .review-stars .s { font-size: 1rem; color: var(--star); }
        .review-stars .s.on { color: var(--star-filled); }

        .review-score-badge {
            margin-left: 0.5rem;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--star-filled);
            background: rgba(251, 191, 36, 0.12);
            padding: 0.15rem 0.5rem;
            border-radius: 6px;
        }

        /* Corpo da resenha / spoiler */
        .review-body { margin-bottom: 1rem; }

        .spoiler-box {
            background: rgba(234,179,8,0.07);
            border: 1px solid rgba(234,179,8,0.25);
            border-radius: 10px;
            padding: 0.9rem 1rem;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }
        .spoiler-box:hover { background: rgba(234,179,8,0.12); }

        .spoiler-warning {
            color: var(--warning);
            font-size: 0.82rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-bottom: 0.5rem;
        }

        .spoiler-text {
            font-size: 0.95rem;
            line-height: 1.7;
            color: var(--text-primary);
            transition: filter 0.3s;
        }
        .spoiler-box.blurred .spoiler-text {
            filter: blur(7px);
            pointer-events: none;
        }

        .review-text {
            font-size: 0.95rem;
            line-height: 1.7;
            color: var(--text-primary);
        }

        /* Ações */
        .review-actions {
            display: flex;
            gap: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px solid var(--border);
        }

        .btn {
            padding: 0.45rem 1rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-like {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .btn-like:hover, .btn-like.liked {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        /* ===== Modal ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            backdrop-filter: blur(8px);
        }
        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--bg-secondary);
            border-radius: 20px;
            max-width: 720px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--border);
            animation: slideUp 0.28s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(24px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }

        .modal-header {
            display: flex;
            gap: 1.5rem;
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .modal-image {
            width: 150px;
            border-radius: 12px;
            flex-shrink: 0;
            object-fit: cover;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .modal-info { flex: 1; min-width: 0; }

        .modal-title {
            font-size: 1.45rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
            line-height: 1.3;
        }

        .modal-meta {
            font-size: 0.88rem;
            color: var(--text-secondary);
            margin-bottom: 0.9rem;
        }
        .modal-meta span { margin-right: 0.9rem; }

        .modal-synopsis {
            font-size: 0.88rem;
            line-height: 1.7;
            color: var(--text-secondary);
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .modal-body { padding: 1.5rem; }

        .form-group { margin-bottom: 1.4rem; }

        .form-label {
            display: block;
            margin-bottom: 0.55rem;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .form-input, .form-textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.3s;
        }
        .form-textarea { resize: vertical; min-height: 110px; }
        .form-input:focus, .form-textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .form-input::placeholder, .form-textarea::placeholder { color: var(--text-muted); }

        /* Estrelas interativas do modal */
        .rating-input {
            display: flex;
            gap: 4px;
        }
        .rating-input label {
            font-size: 2.1rem;
            cursor: pointer;
            color: var(--star);
            transition: color 0.12s, transform 0.12s;
            line-height: 1;
            user-select: none;
        }
        .rating-input label:hover,
        .rating-input label.lit {
            color: var(--star-filled);
            transform: scale(1.18);
        }
        .rating-hint {
            margin-top: 0.4rem;
            font-size: 0.82rem;
            color: var(--text-muted);
            min-height: 1.2em;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        .checkbox-label input[type="checkbox"] {
            width: 17px;
            height: 17px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .modal-footer {
            padding: 1.2rem 1.5rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            background: var(--bg-card);
            border-radius: 0 0 20px 20px;
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover { background: var(--bg-card-hover); }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent) 0%, #8b5cf6 100%);
            color: #fff;
            font-weight: 600;
            box-shadow: 0 4px 15px var(--accent-glow);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--accent-glow);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== Estados ===== */
        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }

        .loading-spinner {
            width: 38px;
            height: 38px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }
        .empty-icon { font-size: 2.8rem; margin-bottom: 0.75rem; }

        /* ===== Temporadas e Episódios ===== */

        /* Tabs de navegação entre "Resenha" e "Episódios" */
        .modal-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            padding: 0 1.5rem;
            gap: 0;
        }
        .modal-tab {
            padding: 0.75rem 1.25rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border: none;
            background: none;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            margin-bottom: -1px;
        }
        .modal-tab:hover { color: var(--text-primary); }
        .modal-tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        /* Painel de episódios */
        .episodes-panel { padding: 1.5rem; }

        /* ── Dropdown de temporada (botão personalizado) ── */
        .seasons-bar {
            margin-bottom: 1.25rem;
            position: relative;
        }

        /* Botão principal — exibe temporada ativa + seta */
        .season-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 0.7rem 1rem 0.7rem 1rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            user-select: none;
        }
        .season-btn:hover {
            border-color: var(--accent);
            background: var(--bg-card-hover);
        }
        .season-btn.open {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
            border-bottom-left-radius: 4px;
            border-bottom-right-radius: 4px;
        }

        /* Ícone de seta no botão */
        .season-btn-arrow {
            flex-shrink: 0;
            width: 18px;
            height: 18px;
            color: var(--text-muted);
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .season-btn.open .season-btn-arrow {
            transform: rotate(180deg);
            color: var(--accent);
        }

        /* Label dentro do botão */
        .season-btn-label {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Lista suspensa */
        .season-dropdown {
            position: absolute;
            top: calc(100% - 1px);
            left: 0;
            right: 0;
            background: var(--bg-card);
            border: 1px solid var(--accent);
            border-top: none;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            overflow: hidden;
            z-index: 200;
            box-shadow: 0 12px 32px rgba(0,0,0,0.45);
            /* Animação de abertura */
            transform-origin: top center;
            animation: dropdownOpen 0.18s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes dropdownOpen {
            from { opacity: 0; transform: scaleY(0.88); }
            to   { opacity: 1; transform: scaleY(1); }
        }

        /* Item da lista */
        .season-option {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.7rem 1rem;
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            border-bottom: 1px solid var(--border);
        }
        .season-option:last-child { border-bottom: none; }
        .season-option:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }
        .season-option.active {
            color: var(--accent);
            font-weight: 700;
            background: rgba(124, 58, 237, 0.08);
        }
        .season-option.active::after {
            content: '✓';
            margin-left: auto;
            font-size: 0.85rem;
            color: var(--accent);
        }

        /* Lista de episódios */
        .episodes-list {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .episode-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.7rem 0.9rem;
            background: var(--bg-card);
            border-radius: 10px;
            border: 1px solid var(--border);
            transition: border-color 0.2s;
        }
        .episode-row:hover { border-color: var(--accent); }

        .episode-num {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--accent);
            min-width: 2rem;
            text-align: center;
            background: rgba(124,58,237,0.12);
            border-radius: 6px;
            padding: 0.2rem 0.4rem;
            flex-shrink: 0;
        }

        .episode-title {
            flex: 1;
            font-size: 0.88rem;
            color: var(--text-primary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .episode-avg {
            font-size: 0.78rem;
            color: var(--star-filled);
            font-weight: 600;
            min-width: 3.5rem;
            text-align: right;
            flex-shrink: 0;
        }

        /* Select de nota */
        .episode-nota-select {
            padding: 0.3rem 0.5rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 0.82rem;
            cursor: pointer;
            flex-shrink: 0;
            min-width: 70px;
            transition: border-color 0.2s;
        }
        .episode-nota-select:focus {
            outline: none;
            border-color: var(--accent);
        }
        .episode-nota-select.rated {
            border-color: var(--star-filled);
            color: var(--star-filled);
        }

        /* Botão guardar nota */
        .episode-save-btn {
            padding: 0.3rem 0.7rem;
            border-radius: 8px;
            border: none;
            background: var(--accent);
            color: #fff;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.18s, transform 0.1s;
        }
        .episode-save-btn:hover { background: var(--accent-hover); transform: scale(1.04); }
        .episode-save-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .episode-save-btn.saved {
            background: var(--success);
        }

        /* Loading / vazio dentro do painel */
        .episodes-loading {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
        }
        .episodes-loading .loading-spinner {
            margin: 0 auto 0.75rem;
        }

        /* ===== Responsivo ===== */
        @media (max-width: 768px) {
            header { padding: 1rem; }
            .header-content { flex-direction: column; gap: 1rem; }
            .search-container { max-width: 100%; width: 100%; }
            main { padding: 1.25rem 1rem; }
            .anime-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; }
            .modal-header { flex-direction: column; align-items: center; text-align: center; }
            .modal-image { width: 130px; }
            .modal-title { font-size: 1.2rem; }
            .modal-footer { flex-direction: column; }
            .modal-footer .btn { width: 100%; justify-content: center; }
            .review-top { flex-wrap: wrap; }
            .episode-row { flex-wrap: wrap; gap: 0.5rem; }
            .episode-title { min-width: 100%; order: -1; }
        }
    </style>
</head>
<body>

    <!-- Toast de sucesso -->
    <div class="toast" id="toast">✅ Resenha enviada com sucesso!</div>

    <!-- ===== Header ===== -->
    <header>
        <div class="header-content">
            <a href="/" class="logo">AniReview</a>
            <div class="search-container">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
                </svg>
                <input type="text" class="search-input" id="searchInput" placeholder="Buscar animes...">
                <button class="search-btn" onclick="searchAnimes()">Buscar</button>
            </div>
        </div>
    </header>

    <!-- ===== Conteúdo ===== -->
    <main>
        <!-- Catálogo -->
        <section class="catalog-section">
            <div class="section-header">
                <h2>Catálogo</h2>
            </div>
            <div class="anime-grid" id="animeGrid">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <div>Carregando animes...</div>
                </div>
            </div>
        </section>

        <!-- Resenhas -->
        <section class="reviews-section">
            <div class="section-header">
                <h2>Resenhas da Comunidade</h2>
            </div>
            <div class="reviews-feed" id="reviewsFeed">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <div>Carregando resenhas...</div>
                </div>
            </div>
        </section>
    </main>

    <!-- ===== Modal ===== -->
    <div class="modal-overlay" id="animeModal" role="dialog" aria-modal="true">
        <div class="modal">
            <div class="modal-header">
                <img class="modal-image" id="modalImage" src="" alt="">
                <div class="modal-info">
                    <h3 class="modal-title" id="modalTitle"></h3>
                    <div class="modal-meta" id="modalMeta"></div>
                    <p class="modal-synopsis" id="modalSynopsis"></p>
                </div>
            </div>

            <!-- Tabs: Resenha | Episódios -->
            <div class="modal-tabs">
                <button class="modal-tab active" id="tabReview"   onclick="switchTab('review')">✍️ Resenha</button>
                <button class="modal-tab"         id="tabEpisodes" onclick="switchTab('episodes')">🎬 Episódios</button>
            </div>

            <!-- ── Painel Resenha ── -->
            <div id="panelReview">
                <div class="modal-body">
                    <!-- Nota por estrelas -->
                    <div class="form-group">
                        <label class="form-label">Sua Nota</label>
                        <div class="rating-input" id="ratingInput" role="group" aria-label="Selecione uma nota de 1 a 10">
                            <!-- gerado via JS -->
                        </div>
                        <div class="rating-hint" id="ratingHint">Clique em uma estrela para dar a nota</div>
                    </div>

                    <!-- Nome -->
                    <div class="form-group">
                        <label class="form-label" for="usernameInput">Seu Nome</label>
                        <input type="text" class="form-input" id="usernameInput" placeholder="Seu nome (opcional)" maxlength="60">
                    </div>

                    <!-- Resenha -->
                    <div class="form-group">
                        <label class="form-label" for="reviewInput">Sua Resenha</label>
                        <textarea class="form-textarea" id="reviewInput" placeholder="O que você achou deste anime?" maxlength="2000"></textarea>
                    </div>

                    <!-- Spoiler -->
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="spoilerCheck">
                            <span>⚠️ Esta resenha contém spoilers</span>
                        </label>
                    </div>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
                    <button class="btn btn-primary" id="submitBtn" onclick="submitReview()">Enviar Resenha</button>
                </div>
            </div>

            <!-- ── Painel Episódios ── -->
            <div id="panelEpisodes" style="display:none;">
                <div class="episodes-panel">
                    <!-- Nome do utilizador para as notas de episódios -->
                    <div class="form-group" style="margin-bottom:1rem;">
                        <label class="form-label" for="epUsernameInput" style="font-size:0.85rem;color:var(--text-secondary);">
                            Seu Nome (para guardar notas)
                        </label>
                        <input type="text" class="form-input" id="epUsernameInput"
                               placeholder="Seu nome (opcional)" maxlength="60"
                               style="padding:0.55rem 0.9rem;font-size:0.88rem;">
                    </div>

                    <!-- Seletor de temporada -->
                    <div class="seasons-bar" id="seasonsBar">
                        <!-- gerado via JS -->
                    </div>

                    <!-- Lista de episódios -->
                    <div id="episodesList">
                        <div class="episodes-loading">
                            <div class="loading-spinner"></div>
                            <div>Carregando temporadas...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== JavaScript ===== -->
    <script>
        /* ── Globais ── */
        let currentAnime        = null;
        let currentRating       = 0;
        let currentSeasons      = [];    // lista de TemporadaDTO
        let currentSeasonId     = null;  // ID da temporada activa na tab episódios
        let currentKitsuSeasons = [];    // [{label, kitsuId}] temporadas Kitsu do anime principal

        const API_BASE      = 'http://localhost:8080';
        const KITSU_BASE    = 'https://kitsu.io/api/edge';
        const KITSU_HEADERS = { 'Accept': 'application/vnd.api+json' };

        const RATING_LABELS = ['', 'Horrível', 'Muito ruim', 'Ruim', 'Fraco', 'Regular',
                                    'Ok', 'Bom', 'Muito bom', 'Ótimo', 'Obra-prima! ★'];

        /* ════════════════════════════════════════════════════════════
           MAPA DE AGRUPAMENTO DE TEMPORADAS
           Relaciona cada ID Kitsu de sequência ao ID "principal"
           e define a lista completa de temporadas daquele anime.
           IDs verificados via Kitsu API — referência MAL/Crunchyroll.
           Formato: animeId → { mainId, seasons: [{label, kitsuId}] }
        ════════════════════════════════════════════════════════════ */
        const ANIME_SEASONS_MAP = (() => {
            // Helper para registrar todos os IDs de um anime no mapa
            function reg(map, mainId, seasons) {
                const entry = { mainId, seasons };
                seasons.forEach(s => { map[s.kitsuId] = entry; });
            }
            const m = {};

            /* ── My Hero Academia ──────────────────────────────────
               T1:11469 T2:12268 T3:13881 T4:41971 T5:43108
               T6:45240 T7:47232 T8(Final):49279                  */
            reg(m, '11469', [
                { label: '1ª Temporada',           kitsuId: '11469' },
                { label: '2ª Temporada',           kitsuId: '12268' },
                { label: '3ª Temporada',           kitsuId: '13881' },
                { label: '4ª Temporada',           kitsuId: '41971' },
                { label: '5ª Temporada',           kitsuId: '43108' },
                { label: '6ª Temporada',           kitsuId: '45240' },
                { label: '7ª Temporada',           kitsuId: '47232' },
                { label: '8ª Temporada — Final',   kitsuId: '49279' },
            ]);

            /* ── Attack on Titan ───────────────────────────────────
               T1:7442 T2:8671 T3 Pt1:13569 T3 Pt2:41982
               Final Pt1:42422 Final Pt2:44240
               Final Chapters Pt1:46038 Pt2:47132               */
            reg(m, '7442', [
                { label: '1ª Temporada',                    kitsuId: '7442'  },
                { label: '2ª Temporada',                    kitsuId: '8671'  },
                { label: '3ª Temporada — Parte 1',          kitsuId: '13569' },
                { label: '3ª Temporada — Parte 2',          kitsuId: '41982' },
                { label: 'Temporada Final — Parte 1',       kitsuId: '42422' },
                { label: 'Temporada Final — Parte 2',       kitsuId: '44240' },
                { label: 'Temporada Final — Capítulos Finais Pt.1', kitsuId: '46038' },
                { label: 'Temporada Final — Capítulos Finais Pt.2', kitsuId: '47132' },
            ]);

            /* ── One Punch Man ─────────────────────────────────────
               T1:10740  T2:12566                                 */
            reg(m, '10740', [
                { label: '1ª Temporada', kitsuId: '10740' },
                { label: '2ª Temporada', kitsuId: '12566' },
            ]);

            /* ── Demon Slayer / Kimetsu no Yaiba ───────────────────
               T1:41370  Mugen Train:45249  Ent.District:44081
               Swordsmith Village:45866  Hashira Training:47635  */
            reg(m, '41370', [
                { label: '1ª Temporada',                kitsuId: '41370' },
                { label: 'Arco do Trem Mugen',          kitsuId: '45249' },
                { label: 'Arco do Distrito do Entretenimento', kitsuId: '44081' },
                { label: 'Arco da Aldeia dos Ferreiros', kitsuId: '45866' },
                { label: 'Arco do Treinamento Hashira', kitsuId: '47635' },
            ]);

            /* ── Jujutsu Kaisen ────────────────────────────────────
               T1:42765  T2:45857                                 */
            reg(m, '42765', [
                { label: '1ª Temporada', kitsuId: '42765' },
                { label: '2ª Temporada', kitsuId: '45857' },
            ]);

            /* ── Sword Art Online ──────────────────────────────────
               T1:6589  T2:8174
               Alicization:13893  WoU Pt1:42213  WoU Pt2:42927  */
            reg(m, '6589', [
                { label: '1ª Temporada',                          kitsuId: '6589'  },
                { label: '2ª Temporada — Gun Gale Online',        kitsuId: '8174'  },
                { label: '3ª Temporada — Alicization',            kitsuId: '13893' },
                { label: '3ª Temporada — War of Underworld Pt.1', kitsuId: '42213' },
                { label: '3ª Temporada — War of Underworld Pt.2', kitsuId: '42927' },
            ]);

            /* ── Tokyo Ghoul ───────────────────────────────────────
               T1:8271  Root A:9135  :re Pt1:13929  :re Pt2:41359 */
            reg(m, '8271', [
                { label: '1ª Temporada',       kitsuId: '8271'  },
                { label: '2ª Temporada Root A', kitsuId: '9135'  },
                { label: '3ª Temporada :re',    kitsuId: '13929' },
                { label: '3ª Temporada :re — Parte 2', kitsuId: '41359' },
            ]);

            /* ── Bleach ────────────────────────────────────────────
               Clássico:244  TYBW Pt1:43078  TYBW Pt2:46903
               TYBW Pt3:48015  TYBW Pt4:49444                    */
            reg(m, '244', [
                { label: 'Bleach — Série Clássica',        kitsuId: '244'   },
                { label: 'TYBW — Pt.1: Encarnação Vermelha',kitsuId: '43078' },
                { label: 'TYBW — Pt.2: Separação',         kitsuId: '46903' },
                { label: 'TYBW — Pt.3: Conflito',          kitsuId: '48015' },
                { label: 'TYBW — Pt.4: Culminação',        kitsuId: '49444' },
            ]);

            /* ── Fullmetal Alchemist: Brotherhood ── série única ─── */
            reg(m, '3936', [
                { label: 'Série Completa', kitsuId: '3936' },
            ]);

            /* ── Naruto ─────────────────────────────────────────── */
            reg(m, '11', [
                { label: 'Naruto Clássico',  kitsuId: '11'   },
                { label: 'Naruto Shippuden', kitsuId: '1555' },
            ]);

            /* ── Dragon Ball Z ──────────────────────────────────── */
            reg(m, '720', [
                { label: 'Dragon Ball Z',    kitsuId: '720'   },
                { label: 'Dragon Ball Super',kitsuId: '10879' },
            ]);

            /* ── Death Note ─────────────── série única ─────────── */
            reg(m, '1376', [
                { label: 'Série Completa', kitsuId: '1376' },
            ]);

            /* ── Hunter x Hunter 2011 ─── série única ────────────── */
            reg(m, '6448', [
                { label: 'Série Completa', kitsuId: '6448' },
            ]);

            return m;
        })();

        /**
         * Retorna o entry do ANIME_SEASONS_MAP para um animeId,
         * ou null se não houver mapeamento.
         */
        function getSeasonEntry(animeId) {
            return ANIME_SEASONS_MAP[String(animeId)] || null;
        }

        /* ═══════════════════════════════════════════════════════════
           CACHE de temporadas detectadas dinamicamente (por sessão)
           Evita refazer a busca Kitsu toda vez que abre o mesmo anime.
        ═══════════════════════════════════════════════════════════ */
        const _dynamicSeasonsCache = {};   // mainId → [{label, kitsuId}]
        const _kitsuEpisodesCache  = {};   // kitsuId → [{numero, titulo}]

        /* ── Init ── */
        document.addEventListener('DOMContentLoaded', () => {
            buildStarInput();
            loadPopularAnimes();
            loadReviews();
            document.getElementById('searchInput').addEventListener('keypress', e => {
                if (e.key === 'Enter') searchAnimes();
            });
        });

        /* ════════════════════════════════
           ESTRELAS INTERATIVAS DO MODAL
        ════════════════════════════════ */
        function buildStarInput() {
            const container = document.getElementById('ratingInput');
            container.innerHTML = '';
            for (let i = 1; i <= 10; i++) {
                const lbl = document.createElement('label');
                lbl.textContent = '★';
                lbl.title = `${i} — ${RATING_LABELS[i]}`;
                lbl.addEventListener('click', () => setRating(i));
                lbl.addEventListener('mouseenter', () => highlightStars(i));
                lbl.addEventListener('mouseleave', () => highlightStars(currentRating));
                container.appendChild(lbl);
            }
        }

        function highlightStars(upTo) {
            document.querySelectorAll('#ratingInput label').forEach((lbl, idx) => {
                lbl.classList.toggle('lit', idx < upTo);
            });
            document.getElementById('ratingHint').textContent =
                upTo > 0 ? `${upTo}/10 — ${RATING_LABELS[upTo]}` : 'Clique em uma estrela para dar a nota';
        }

        function setRating(n) {
            currentRating = n;
            highlightStars(n);
        }

        /* ════════════════════════════════
           KITSU API
        ════════════════════════════════ */
        function kitsuScore(raw) {
            if (!raw) return null;
            return (parseFloat(raw) / 10).toFixed(1);
        }

        async function loadPopularAnimes() {
            setGridLoading();
            try {
                const res  = await fetch(`${KITSU_BASE}/anime?page[limit]=20&sort=-userCount`, { headers: KITSU_HEADERS });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                displayAnimes(data.data);
            } catch (err) {
                console.error('Erro ao carregar catálogo:', err);
                setGridError('Não foi possível carregar o catálogo. Verifique sua conexão.');
            }
        }

        async function searchAnimes() {
            const q = document.getElementById('searchInput').value.trim();
            if (!q) { loadPopularAnimes(); return; }

            setGridLoading('Buscando...');
            try {
                const res  = await fetch(
                    `${KITSU_BASE}/anime?filter[text]=${encodeURIComponent(q)}&page[limit]=20`,
                    { headers: KITSU_HEADERS }
                );
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                displayAnimes(data.data);
            } catch (err) {
                console.error('Erro na busca:', err);
                setGridError('Erro na busca. Tente novamente.');
            }
        }

        function displayAnimes(list) {
            const grid = document.getElementById('animeGrid');
            if (!list || list.length === 0) {
                grid.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><div>Nenhum anime encontrado</div></div>`;
                return;
            }
            grid.innerHTML = list.map(item => {
                const a     = item.attributes;
                const title = escapeHtml(a.canonicalTitle || 'Sem título');
                const cover = a.posterImage?.small || 'https://placehold.co/200x300/1f1f26/71717a?text=Sem+Capa';
                const score = kitsuScore(a.averageRating);
                const year  = a.startDate ? a.startDate.slice(0, 4) : '?';
                return `
                <div class="anime-card" onclick="openModal('${item.id}')" tabindex="0"
                     onkeypress="if(event.key==='Enter') openModal('${item.id}')">
                    <div class="anime-card-image-container">
                        <img class="anime-card-image" src="${cover}" alt="${title}" loading="lazy">
                        ${score ? `<div class="anime-card-score">
                            <svg width="11" height="11" viewBox="0 0 24 24" fill="#fbbf24">
                                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                            </svg>${score}</div>` : ''}
                    </div>
                    <div class="anime-card-info">
                        <div class="anime-card-title">${title}</div>
                        <div class="anime-card-meta">${a.subtype || '?'} • ${year}</div>
                    </div>
                </div>`;
            }).join('');
        }

        function setGridLoading(msg = 'Carregando animes...') {
            document.getElementById('animeGrid').innerHTML =
                `<div class="loading"><div class="loading-spinner"></div><div>${msg}</div></div>`;
        }

        function setGridError(msg) {
            document.getElementById('animeGrid').innerHTML =
                `<div class="empty-state"><div class="empty-icon">⚠️</div><div>${msg}</div></div>`;
        }

        /* ════════════════════════════════
           MODAL
        ════════════════════════════════ */

        /**
         * Abre o modal de um anime.
         * 1. Se o ID tiver mapeamento manual (ANIME_SEASONS_MAP) → usa direto.
         * 2. Se não tiver, busca na Kitsu as relações prequel/sequel para
         *    montar dinamicamente a lista de temporadas e armazena em cache.
         */
        async function openModal(animeId) {
            try {
                // ── Passo 1: verifica mapa manual ──
                let entry = getSeasonEntry(animeId);
                let kitsuSeasons = entry ? entry.seasons : null;

                // ── Passo 2: se não tem mapa, tenta detectar dinamicamente ──
                if (!kitsuSeasons) {
                    kitsuSeasons = await detectKitsuSeasons(animeId);
                }

                // ID principal = primeiro da lista (prequel-most) ou próprio
                const mainId = (kitsuSeasons && kitsuSeasons.length > 0)
                    ? kitsuSeasons[0].kitsuId   // T1 sempre é o mainId
                    : animeId;

                // Para a capa e título, usa o mainId (T1) se houver séries múltiplas
                const fetchId = (kitsuSeasons && kitsuSeasons.length > 1)
                    ? mainId
                    : animeId;

                const res  = await fetch(`${KITSU_BASE}/anime/${fetchId}`, { headers: KITSU_HEADERS });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const json = await res.json();
                const a    = json.data.attributes;

                currentAnime = {
                    id:         animeId,
                    mainId:     fetchId,
                    title:      a.canonicalTitle || 'Sem título',
                    image:      a.posterImage?.small || '',
                    synopsis:   a.synopsis       || 'Sem sinopse disponível.',
                    score:      kitsuScore(a.averageRating),
                    type:       a.subtype,
                    episodes:   kitsuSeasons && kitsuSeasons.length > 1 ? null : a.episodeCount,
                    year:       a.startDate ? a.startDate.slice(0, 4) : null,
                    hasSeasons: !!(kitsuSeasons && kitsuSeasons.length > 1),
                };

                currentKitsuSeasons = kitsuSeasons || [];

                document.getElementById('modalImage').src = currentAnime.image;
                document.getElementById('modalImage').alt = currentAnime.title;
                document.getElementById('modalTitle').textContent = currentAnime.title;
                document.getElementById('modalSynopsis').textContent = currentAnime.synopsis;

                const numSeasons = currentKitsuSeasons.length;
                const meta = [
                    currentAnime.type     && `<span>${currentAnime.type}</span>`,
                    currentAnime.episodes && `<span>${currentAnime.episodes} eps</span>`,
                    currentAnime.year     && `<span>${currentAnime.year}</span>`,
                    currentAnime.score    && `<span>★ ${currentAnime.score}</span>`,
                    numSeasons > 1        && `<span>📺 ${numSeasons} temporada${numSeasons > 1 ? 's' : ''}</span>`,
                ].filter(Boolean).join('');
                document.getElementById('modalMeta').innerHTML = meta;

                resetForm();
                document.getElementById('animeModal').classList.add('active');
                document.getElementById('usernameInput').focus();
            } catch (err) {
                console.error('Erro ao abrir modal:', err);
                alert('Não foi possível carregar os detalhes deste anime.');
            }
        }

        /**
         * Detecta todas as temporadas de um anime via Kitsu relationships.
         * Navega para o prequel mais antigo (T1) e depois segue os sequels.
         * Retorna [{label, kitsuId}] ou [] se apenas uma temporada.
         * Usa cache para não repetir chamadas.
         */
        async function detectKitsuSeasons(animeId) {
            const id = String(animeId);

            // Cache hit
            if (_dynamicSeasonsCache[id]) return _dynamicSeasonsCache[id];

            try {
                // Busca o anime com suas relações
                const res = await fetch(
                    `${KITSU_BASE}/anime/${id}/relationships/sequels`,
                    { headers: KITSU_HEADERS }
                );

                // Também busca prequels para checar se este já é T1
                const [seqRes, preqRes] = await Promise.all([
                    fetch(`${KITSU_BASE}/anime/${id}/relationships/sequels`, { headers: KITSU_HEADERS }),
                    fetch(`${KITSU_BASE}/anime/${id}/relationships/prequels`, { headers: KITSU_HEADERS })
                ]);

                let sequelIds   = [];
                let prequelIds  = [];

                if (seqRes.ok)  { const d = await seqRes.json();  sequelIds  = (d.data || []).map(x => x.id); }
                if (preqRes.ok) { const d = await preqRes.json(); prequelIds = (d.data || []).map(x => x.id); }

                // Se não tem nem sequel nem prequel, é série única → sem select
                if (sequelIds.length === 0 && prequelIds.length === 0) {
                    _dynamicSeasonsCache[id] = [];
                    return [];
                }

                // Navega até o T1 (sem prequel) seguindo prequels
                let rootId = id;
                const visited = new Set();
                while (prequelIds.length > 0 && !visited.has(rootId)) {
                    visited.add(rootId);
                    const prev = prequelIds[0];
                    const r = await fetch(`${KITSU_BASE}/anime/${prev}/relationships/prequels`, { headers: KITSU_HEADERS });
                    prequelIds = r.ok ? ((await r.json()).data || []).map(x => x.id) : [];
                    rootId = prev;
                    if (visited.size > 8) break; // limite de segurança
                }

                // Agora navega para frente a partir do rootId, coletando sequels
                const chain = [rootId];
                let nextIds  = [];
                const seen   = new Set([rootId]);
                let cursor   = rootId;

                for (let i = 0; i < 8; i++) {
                    const r = await fetch(`${KITSU_BASE}/anime/${cursor}/relationships/sequels`, { headers: KITSU_HEADERS });
                    if (!r.ok) break;
                    const d = await r.json();
                    nextIds = (d.data || []).map(x => x.id).filter(x => !seen.has(x));
                    if (nextIds.length === 0) break;
                    cursor = nextIds[0];
                    seen.add(cursor);
                    chain.push(cursor);
                }

                if (chain.length <= 1) {
                    _dynamicSeasonsCache[id] = [];
                    return [];
                }

                // Monta lista de temporadas com labels ordinais
                const ordinals = ['1ª','2ª','3ª','4ª','5ª','6ª','7ª','8ª','9ª','10ª'];
                const seasons = chain.map((kid, idx) => ({
                    label:   `${ordinals[idx] || (idx+1)+'ª'} Temporada`,
                    kitsuId: kid,
                }));

                // Armazena em cache para todos os IDs da chain
                chain.forEach(kid => { _dynamicSeasonsCache[kid] = seasons; });
                return seasons;

            } catch (err) {
                console.warn('detectKitsuSeasons falhou para', animeId, err);
                return [];
            }
        }

        function closeModal() {
            // Fecha qualquer dropdown de temporada aberto antes de fechar o modal
            const openDrop = document.getElementById('seasonDropdownList');
            if (openDrop) openDrop.remove();
            const openBtn = document.getElementById('seasonDropdownBtn');
            if (openBtn) { openBtn.classList.remove('open'); openBtn.setAttribute('aria-expanded','false'); }
            document.getElementById('animeModal').classList.remove('active');
        }

        function resetForm() {
            currentRating       = 0;
            currentSeasons      = [];
            currentSeasonId     = null;
            currentKitsuSeasons = [];
            highlightStars(0);
            document.getElementById('usernameInput').value  = '';
            document.getElementById('reviewInput').value    = '';
            document.getElementById('spoilerCheck').checked = false;
            document.getElementById('submitBtn').disabled   = false;
            document.getElementById('submitBtn').textContent = 'Enviar Resenha';
            // Volta para a tab Resenha
            switchTab('review');
            // Limpa o painel de episódios
            document.getElementById('seasonsBar').innerHTML  = '';
            document.getElementById('episodesList').innerHTML =
                '<div class="episodes-loading"><div class="loading-spinner"></div><div>Carregando temporadas...</div></div>';
        }

        /* ════════════════════════════════
           TABS DO MODAL
        ════════════════════════════════ */
        function switchTab(tab) {
            const isEp = tab === 'episodes';
            document.getElementById('panelReview').style.display   = isEp ? 'none' : '';
            document.getElementById('panelEpisodes').style.display = isEp ? '' : 'none';
            document.getElementById('tabReview').classList.toggle('active',   !isEp);
            document.getElementById('tabEpisodes').classList.toggle('active',  isEp);

            if (isEp && currentAnime) {
                // Se ainda não criou o dropdown de temporadas, inicializa
                if (!document.getElementById('seasonDropdownBtn')) {
                    initSeasonSelect();
                }
            }
        }
