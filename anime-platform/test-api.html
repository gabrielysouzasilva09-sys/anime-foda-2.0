<!DOCTYPE html>
<html>
<head>
    <title>Teste de Conectividade</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #1a1a1a; color: #fff; }
        .test { margin: 20px 0; padding: 15px; border-radius: 8px; }
        .success { background: #1f3f1f; border: 1px solid #2f7f2f; }
        .error { background: #3f1f1f; border: 1px solid #7f2f2f; }
        .loading { background: #2a2a2a; }
    </style>
</head>
<body>
    <h1>Teste de Conectividade</h1>

    <div id="jikan-test" class="test loading">Testando Jikan API...</div>
    <div id="backend-test" class="test loading">Testando Backend Java...</div>

    <script>
        // Teste 1: Jikan API
        async function testJikan() {
            const div = document.getElementById('jikan-test');
            try {
                const response = await fetch('https://api.jikan.moe/v4/top/anime');
                const data = await response.json();
                div.className = 'test success';
                div.innerHTML = `<strong>Jikan API:</strong> OK - ${data.data?.length || 0} animes carregados`;
            } catch (error) {
                div.className = 'test error';
                div.innerHTML = `<strong>Jikan API:</strong> ERRO - ${error.message}`;
            }
        }

        // Teste 2: Backend Java
        async function testBackend() {
            const div = document.getElementById('backend-test');
            try {
                const response = await fetch('/api/reviews');
                const data = await response.json();
                div.className = 'test success';
                div.innerHTML = `<strong>Backend Java:</strong> OK - ${data.length} resenhas`;
            } catch (error) {
                div.className = 'test error';
                div.innerHTML = `<strong>Backend Java:</strong> ERRO - ${error.message}<br>Certifique-se de que o Spring Boot está rodando em http://localhost:8080`;
            }
        }

        testJikan();
        testBackend();
    </script>
</body>
</html>
